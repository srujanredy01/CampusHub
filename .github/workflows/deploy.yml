name: Deploy CampusHub to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Validate Backend ──────────────────────────────────────────────────────
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub_user
          POSTGRES_PASSWORD: campushub_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Django check + migrations
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-key-not-real-32chars-long-enough"
          DEBUG: "True"
          DB_NAME: campushub_test
          DB_USER: campushub_user
          DB_PASSWORD: campushub_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/2
          EXECUTOR_SERVICE_URL: http://localhost:8001
          FRONTEND_URL: http://localhost
        run: |
          python manage.py check
          python manage.py migrate --noinput

  # ── 2. Build Frontend ────────────────────────────────────────────────────────
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Verify build output
        run: |
          test -f frontend/dist/index.html || { echo "ERROR: Build failed - no index.html"; exit 1; }
          echo "Frontend build successful"
          ls -la frontend/dist/

  # ── 3. Deploy to EC2 ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 15m
          script_stop: true
          script: |
            set -e
            echo "=== CampusHub Deploy $(date '+%Y-%m-%d %H:%M:%S') ==="
            cd /opt/campushub

            # Verify .env exists
            if [ ! -f ./backend/.env ]; then
              echo "ERROR: backend/.env not found! Configure it first."
              exit 1
            fi

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")

            # Pull latest
            echo "[1/5] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            echo "  $(git log -1 --oneline)"

            # Stop old containers
            echo "[2/5] Stopping containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            # Build and start
            echo "[3/5] Building and starting..."
            docker compose -f docker-compose.prod.yml up --build -d

            # Wait for health
            echo "[4/5] Waiting for backend health..."
            HEALTHY=false
            for i in $(seq 1 40); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' campushub_backend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                echo "  Healthy after ~$((i*5))s"
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERROR: Backend unhealthy. Rolling back..."
              docker logs campushub_backend --tail=50
              docker compose -f docker-compose.prod.yml down || true
              git reset --hard "$PREV_COMMIT"
              docker compose -f docker-compose.prod.yml up --build -d
              exit 1
            fi

            # Verify
            echo "[5/5] Verifying..."
            docker compose -f docker-compose.prod.yml ps
            curl -sf http://localhost/api/health/ && echo "  API: OK" || echo "  API: FAILED"
            curl -sf http://localhost/ > /dev/null && echo "  Frontend: OK" || echo "  Frontend: FAILED"
            echo "=== Deploy Complete ==="

      - name: Report failure
        if: failure()
        run: echo "::error::Deployment FAILED for ${{ github.sha }}"
