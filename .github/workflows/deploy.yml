name: Deploy CampusHub to AWS EC2

on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  # ── 1. Backend Validation ────────────────────────────────────────────────────
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub_user
          POSTGRES_PASSWORD: campushub_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Django system check
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-key-not-real-32chars-long"
          DEBUG: "True"
          DB_NAME: "campushub_test"
          DB_USER: "campushub_user"
          DB_PASSWORD: "campushub_pass"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          EXECUTOR_SERVICE_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost"
        run: python manage.py check

      - name: Run migrations
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-key-not-real-32chars-long"
          DEBUG: "True"
          DB_NAME: "campushub_test"
          DB_USER: "campushub_user"
          DB_PASSWORD: "campushub_pass"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          EXECUTOR_SERVICE_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost"
        run: python manage.py migrate --noinput

  # ── 2. Validate Frontend (static files check) ───────────────────────────────
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify frontend HTML files exist
        run: |
          echo "Checking frontend static files..."
          REQUIRED_FILES="index.html login.html signup.html dashboard.html profile.html resources.html news.html codinghub.html admin.html"
          MISSING=0
          for f in $REQUIRED_FILES; do
            if [ ! -f "frontend/$f" ]; then
              echo "  MISSING: frontend/$f"
              MISSING=$((MISSING + 1))
            else
              echo "  OK: frontend/$f"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING required frontend files missing!"
            exit 1
          fi
          echo "All frontend files present."

      - name: Verify frontend assets exist
        run: |
          test -f frontend/assets/css/styles.css || { echo "MISSING: styles.css"; exit 1; }
          test -f frontend/assets/js/api.js || { echo "MISSING: api.js"; exit 1; }
          test -f frontend/assets/js/app.js || { echo "MISSING: app.js"; exit 1; }
          test -f frontend/assets/js/layout.js || { echo "MISSING: layout.js"; exit 1; }
          echo "All frontend assets present."

      - name: Verify Dockerfile.prod exists
        run: |
          test -f frontend/Dockerfile.prod || { echo "MISSING: Dockerfile.prod"; exit 1; }
          echo "Dockerfile.prod present."

  # ── 3. Deploy to EC2 ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-backend, validate-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 15m
          script_stop: true
          script: |
            set -e

            echo "======================================"
            echo "  CampusHub Deployment Started"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================"

            cd /opt/campushub

            # Verify .env exists (must be pre-configured on EC2)
            if [ ! -f ./backend/.env ]; then
              echo "ERROR: backend/.env not found on server!"
              echo "Run: cp backend/.env.production backend/.env && nano backend/.env"
              exit 1
            fi

            # Snapshot current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "  Previous commit: ${PREV_COMMIT}"

            # Backup database
            echo "[1/6] Creating database backup..."
            bash docker/postgres/backup.sh 2>/dev/null || echo "  WARNING: Backup skipped (first deploy?)"

            # Pull latest code
            echo "[2/6] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            echo "  Commit: $(git log -1 --oneline)"

            # Stop old containers
            echo "[3/6] Stopping old containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            # Build and start
            echo "[4/6] Building and starting containers..."
            docker compose -f docker-compose.prod.yml up --build -d

            # Wait for backend health
            echo "[5/6] Waiting for backend to be healthy..."
            HEALTHY=false
            for i in $(seq 1 40); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' campushub_backend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                echo "  Backend healthy after ~$((i * 5))s"
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERROR: Backend not healthy. Logs:"
              docker logs campushub_backend --tail=50
              echo ""
              echo "Rolling back to ${PREV_COMMIT}..."
              docker compose -f docker-compose.prod.yml down || true
              git reset --hard "${PREV_COMMIT}"
              docker compose -f docker-compose.prod.yml up --build -d
              exit 1
            fi

            # Verify all services
            echo "[6/6] Verifying services..."
            docker compose -f docker-compose.prod.yml ps
            echo ""
            curl -sf http://localhost/api/health/ && echo "  API: OK" || echo "  API: FAILED"
            curl -sf http://localhost/health && echo "  Nginx: OK" || echo "  Nginx: FAILED"
            curl -sf http://localhost/ > /dev/null && echo "  Frontend: OK" || echo "  Frontend: FAILED"

            echo ""
            echo "======================================"
            echo "  Deployment Complete!"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment FAILED for commit ${{ github.sha }} by ${{ github.actor }}"
