name: Deploy CampusHub to AWS EC2

on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  # ── 1. Backend Tests ─────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub_user
          POSTGRES_PASSWORD: campushub_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Django system check
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-key-not-real-32chars-long"
          DEBUG: "True"
          DB_NAME: "campushub_test"
          DB_USER: "campushub_user"
          DB_PASSWORD: "campushub_pass"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          EXECUTOR_SERVICE_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost"
        run: python manage.py check

      - name: Run migrations
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-key-not-real-32chars-long"
          DEBUG: "True"
          DB_NAME: "campushub_test"
          DB_USER: "campushub_user"
          DB_PASSWORD: "campushub_pass"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          EXECUTOR_SERVICE_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost"
        run: python manage.py migrate --noinput

  # ── 2. Validate ─────────────────────────────────────────────────────────────
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint backend (flake8)
        run: |
          flake8 backend/ \
            --max-line-length=120 \
            --exclude=backend/apps/*/migrations/,backend/.venv/ \
            --count --statistics
        continue-on-error: true  # warn but don't block deploy

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-key-not-real"
          DEBUG: "True"
          DB_NAME: "campushub"
          DB_USER: "campushub_user"
          DB_PASSWORD: "campushub_pass"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          EXECUTOR_SERVICE_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost"
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  # ── 3. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      # ── Checkout (just to validate the push) ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Deploy via SSH ────────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          port:        ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || '22' }}
          timeout:     15m
          script_stop: true   # stop on first error
          script: |
            set -e

            echo "======================================"
            echo "  CampusHub Deployment Started"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================"

            # ── Navigate to project ──────────────────────────────────────
            cd /opt/campushub

            # ── Snapshot current commit for rollback ─────────────────────
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "      Previous commit: ${PREV_COMMIT}"

            # ── Backup database before deploy ────────────────────────────
            echo "[0/7] Creating pre-deploy database backup..."
            bash docker/postgres/backup.sh || echo "      WARNING: Backup failed, continuing..."

            # ── Pull latest code ─────────────────────────────────────────
            echo "[1/7] Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git log -1 --oneline)
            echo "      Commit: ${NEW_COMMIT}"

            # ── Stop old containers ──────────────────────────────────────
            echo "[2/7] Stopping old containers..."
            docker compose -f docker-compose.prod.yml --env-file ./backend/.env down --remove-orphans || true

            # ── Clean unused Docker images ───────────────────────────────
            echo "[3/7] Cleaning unused Docker images..."
            docker image prune -f || true

            # ── Rebuild and start ────────────────────────────────────────
            echo "[4/7] Building and starting containers..."
            docker compose -f docker-compose.prod.yml --env-file ./backend/.env up --build -d

            # ── Wait for backend to be healthy ───────────────────────────
            echo "[5/7] Waiting for backend health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' campushub_backend 2>/dev/null || echo "starting")
              echo "      Attempt $i/30 — backend status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                echo "      Backend is healthy!"
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "      ERROR: Backend did not become healthy. Rolling back..."
              docker compose -f docker-compose.prod.yml --env-file ./backend/.env down --remove-orphans || true
              git reset --hard "${PREV_COMMIT}"
              docker compose -f docker-compose.prod.yml --env-file ./backend/.env up --build -d
              echo "      Rollback to ${PREV_COMMIT} initiated."
              docker logs campushub_backend --tail=100
              exit 1
            fi

            # ── Verify all containers are running ────────────────────────
            echo "[6/7] Verifying container status..."
            docker compose -f docker-compose.prod.yml ps

            # ── Quick API health check ───────────────────────────────────
            echo "[7/7] Testing API health endpoint..."
            for i in 1 2 3; do
              if curl -sf http://localhost/api/health/ > /dev/null; then
                echo "      API health check PASSED"
                break
              fi
              echo "      Attempt $i failed, retrying..."
              sleep 5
            done

            echo "======================================"
            echo "  Deployment Complete!"
            echo "  Commit: ${NEW_COMMIT}"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================"

      # ── 4. Notify on failure ──────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          # Add Slack/email notification here if needed
