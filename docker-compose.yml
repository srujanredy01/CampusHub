# ─────────────────────────────────────────────────────────────────────────────
#  CampusHub — Local Development Docker Compose
#  Run:  docker compose up --build
#  App:  http://localhost
#  API:  http://localhost/api/docs/
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: campushub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campushub
      POSTGRES_USER: campushub_user
      POSTGRES_PASSWORD: campushub_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushub_user -d campushub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campushub_net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: campushub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - campushub_net

  # ── Django Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             python manage.py create_admin --noinput 2>/dev/null;
             daphne -b 0.0.0.0 -p 8000 campushub.asgi:application"
    networks:
      - campushub_net

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    volumes:
      - ./backend:/app
    command: celery -A campushub worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campushub_net

  # ── Code Executor (sandbox) ─────────────────────────────────────────────────
  executor:
    build:
      context: ./docker/executor
      dockerfile: Dockerfile
    container_name: campushub_executor
    restart: unless-stopped
    environment:
      - EXECUTOR_WORK_DIR=/tmp/executor
      - EXECUTOR_MEMORY_MB=192
      - EXECUTOR_TIMEOUT_SEC=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - executor_work:/tmp/executor
    ports:
      - "8001:8001"
    networks:
      - campushub_net

  # ── Static Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: campushub_frontend
    restart: unless-stopped
    networks:
      - campushub_net

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: campushub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - campushub_net

volumes:
  postgres_data:
  static_files:
  media_files:
  executor_work:

networks:
  campushub_net:
    driver: bridge
