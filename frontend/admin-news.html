<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage News — CampusHub Admin</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (function() {
      if (!CampusHubAPI.isAuthenticated()) { window.location.href = '/login.html'; return; }
      const user = CampusHubAPI.getUser();
      if (user?.role !== 'admin') { window.location.href = '/dashboard.html'; return; }
      Layout.render('News Management', true);
      loadNews();

      async function loadNews() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="page-loader"><div class="spinner spinner-lg"></div></div>';
        try {
          const res = await CampusHubAPI.get('/news/');
          const items = res.results || res.data || [];
          let html = '<div class="flex justify-between items-center" style="margin-bottom:1.5rem"><h2 style="font-size:1.125rem;font-weight:600">All News Articles</h2></div>';
          html += '<div class="table-container"><table><thead><tr><th>Title</th><th>Published</th><th>Pinned</th></tr></thead><tbody>';
          items.forEach(a => {
            html += `<tr><td style="font-weight:500">${App.escapeHtml(a.title)}</td><td style="font-size:0.8125rem">${App.formatDate(a.created_at)}</td><td>${a.is_pinned ? '<span class="badge badge-warning">Pinned</span>' : '—'}</td></tr>`;
          });
          html += '</tbody></table></div>';
          content.innerHTML = html;
        } catch(err) {
          content.innerHTML = '<div class="empty-state"><div class="empty-state-title">Failed to load news</div></div>';
        }
      }
    })();
  </script>
</body>
</html>
