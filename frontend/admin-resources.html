<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Resources — CampusHub Admin</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (function() {
      if (!CampusHubAPI.isAuthenticated()) { window.location.href = '/login.html'; return; }
      const user = CampusHubAPI.getUser();
      if (user?.role !== 'admin') { window.location.href = '/dashboard.html'; return; }
      Layout.render('Resource Management', true);
      loadResources();

      async function loadResources() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="page-loader"><div class="spinner spinner-lg"></div></div>';
        try {
          const res = await CampusHubAPI.get('/resources/');
          const items = res.results || res.data || [];
          let html = '<div class="flex justify-between items-center" style="margin-bottom:1.5rem"><h2 style="font-size:1.125rem;font-weight:600">All Resources</h2></div>';
          html += '<div class="table-container"><table><thead><tr><th>Title</th><th>Subject</th><th>Uploaded</th><th>Status</th></tr></thead><tbody>';
          items.forEach(r => {
            html += `<tr><td style="font-weight:500">${App.escapeHtml(r.title)}</td><td>${App.escapeHtml(r.subject || r.branch || '')}</td><td style="font-size:0.8125rem">${App.formatDate(r.created_at)}</td><td>${r.is_active !== false ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Hidden</span>'}</td></tr>`;
          });
          html += '</tbody></table></div>';
          content.innerHTML = html;
        } catch(err) {
          content.innerHTML = '<div class="empty-state"><div class="empty-state-title">Failed to load resources</div></div>';
        }
      }
    })();
  </script>
</body>
</html>
