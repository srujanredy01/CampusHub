<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (function() {
      if (!CampusHubAPI.isAuthenticated()) { window.location.href = '/login.html'; return; }
      Layout.render('Coding Hub', false);
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) { window.location.href = '/codinghub.html'; return; }
      loadQuestion(id);

      async function loadQuestion(qid) {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="page-loader"><div class="spinner spinner-lg"></div></div>';
        try {
          const res = await CampusHubAPI.get(`/questions/${qid}`);
          const q = res.data || res;
          const diffClass = q.difficulty === 'easy' ? 'badge-easy' : q.difficulty === 'medium' ? 'badge-medium' : 'badge-hard';
          content.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
              <div class="card" style="overflow-y:auto;max-height:calc(100vh - 160px)">
                <div class="flex items-center gap-2" style="margin-bottom:1rem">
                  <span class="badge ${diffClass}">${q.difficulty}</span>
                  <span style="font-size:0.75rem;color:var(--slate-400)">${App.escapeHtml(q.topic || '')}</span>
                </div>
                <h1 style="font-size:1.25rem;font-weight:700;margin-bottom:1rem">${App.escapeHtml(q.title)}</h1>
                <div style="font-size:0.875rem;color:var(--slate-600);line-height:1.8;white-space:pre-wrap">${App.escapeHtml(q.description || '')}</div>
                ${q.constraints ? `<div style="margin-top:1rem;padding:0.75rem;background:var(--surface-50);border-radius:var(--radius-lg);font-size:0.8125rem"><strong>Constraints:</strong><br>${App.escapeHtml(q.constraints)}</div>` : ''}
                ${q.sample_input ? `<div style="margin-top:1rem"><strong style="font-size:0.8125rem">Sample Input:</strong><pre class="code-output" style="margin-top:0.5rem">${App.escapeHtml(q.sample_input)}</pre></div>` : ''}
                ${q.sample_output ? `<div style="margin-top:0.75rem"><strong style="font-size:0.8125rem">Sample Output:</strong><pre class="code-output" style="margin-top:0.5rem">${App.escapeHtml(q.sample_output)}</pre></div>` : ''}
              </div>
              <div>
                <div class="card" style="margin-bottom:1rem">
                  <div class="flex justify-between items-center" style="margin-bottom:0.75rem">
                    <select id="lang-select" class="form-input" style="width:auto;padding:0.5rem 1rem;font-size:0.8125rem">
                      <option value="python">Python</option><option value="java">Java</option><option value="cpp">C++</option><option value="javascript">JavaScript</option><option value="c">C</option>
                    </select>
                    <div class="flex gap-2">
                      <button class="btn btn-secondary btn-sm" onclick="runCode('${qid}')">▶ Run</button>
                      <button class="btn btn-primary btn-sm" onclick="submitCode('${qid}')">Submit</button>
                    </div>
                  </div>
                  <textarea id="code-editor" class="code-editor" placeholder="Write your code here..." spellcheck="false">${App.escapeHtml((q.starter_code && q.starter_code.python) || '')}</textarea>
                </div>
                <div class="card">
                  <h3 style="font-size:0.875rem;font-weight:600;margin-bottom:0.5rem">Output</h3>
                  <div id="output" class="code-output" style="min-height:80px">Run your code to see output here.</div>
                </div>
              </div>
            </div>`;
        } catch(err) {
          content.innerHTML = '<div class="empty-state"><div class="empty-state-title">Question not found</div><a href="/codinghub.html" class="btn btn-primary btn-sm" style="margin-top:1rem">Back to Problems</a></div>';
        }
      }

      window.runCode = async function(qid) {
        const code = document.getElementById('code-editor').value;
        const lang = document.getElementById('lang-select').value;
        const output = document.getElementById('output');
        output.textContent = 'Running...';
        try {
          const res = await CampusHubAPI.post('/code/run', { language: lang, code, stdin: '' });
          const d = res.data || res;
          output.textContent = d.stdout || d.stderr || 'No output';
          if (d.status !== 'success') output.style.color = 'var(--danger)';
          else output.style.color = 'var(--slate-700)';
        } catch(err) { output.textContent = 'Error: ' + (err.message || 'Execution failed'); output.style.color = 'var(--danger)'; }
      };

      window.submitCode = async function(qid) {
        const code = document.getElementById('code-editor').value;
        const lang = document.getElementById('lang-select').value;
        const output = document.getElementById('output');
        output.textContent = 'Submitting...';
        try {
          const res = await CampusHubAPI.post('/code/submit', { question_id: qid, language: lang, code });
          const d = res.data || res;
          const status = d.status || 'unknown';
          output.textContent = `Status: ${status.replace(/_/g,' ')}\nPassed: ${d.passed_test_cases || 0}/${d.total_test_cases || 0}`;
          output.style.color = status === 'accepted' ? 'var(--success)' : 'var(--danger)';
          if (status === 'accepted') Toast.success('Accepted! 🎉');
        } catch(err) { output.textContent = 'Error: ' + (err.message || 'Submission failed'); output.style.color = 'var(--danger)'; }
      };
    })();
  </script>
</body>
</html>
