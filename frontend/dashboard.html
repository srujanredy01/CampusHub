<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (function() {
      if (!CampusHubAPI.isAuthenticated()) { window.location.href = '/login.html'; return; }
      Layout.render('Dashboard', false);
      loadDashboard();

      async function loadDashboard() {
        const content = document.getElementById('page-content');
        const user = CampusHubAPI.getUser();
        const firstName = (user?.full_name || 'Student').split(' ')[0];

        content.innerHTML = '<div class="page-loader"><div class="spinner spinner-lg"></div></div>';

        let profile = {};
        try { const res = await CampusHubAPI.get('/profile/'); profile = res.data || res; } catch(e) {}

        const total = profile.total_questions_solved || 0;
        const easy = profile.easy_solved || 0;
        const medium = profile.medium_solved || 0;
        const hard = profile.hard_solved || 0;
        const submissions = profile.total_submissions || 0;

        content.innerHTML = `
          <div class="hero-banner" style="margin-bottom:1.5rem">
            <div style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
              <div>
                <p style="color:rgba(255,255,255,0.7);font-size:0.875rem;margin-bottom:0.25rem">Good day,</p>
                <h1 style="font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:0.25rem">${App.escapeHtml(firstName)}</h1>
                <p style="color:rgba(255,255,255,0.6);font-size:0.875rem">${App.escapeHtml(user?.branch || '')}${user?.semester ? ' · Year ' + user.semester : ''}${user?.section ? ' · Section ' + user.section : ''}</p>
              </div>
              <div style="text-align:right">
                <p style="color:rgba(255,255,255,0.6);font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.05em">Problems Solved</p>
                <p style="font-size:2.5rem;font-weight:700;color:#fff">${total}</p>
                <p style="color:rgba(255,255,255,0.5);font-size:0.75rem">${submissions} submissions</p>
              </div>
            </div>
          </div>

          <div class="card-grid card-grid-4" style="margin-bottom:1.5rem">
            <div class="card stat-card"><div class="stat-icon" style="background:var(--primary-50);color:var(--primary-600)">${Layout.icons.code}</div><div class="stat-value">${total}</div><div class="stat-label">Problems Solved</div></div>
            <div class="card stat-card"><div class="stat-icon" style="background:#d1fae5;color:#065f46">${Layout.icons.code}</div><div class="stat-value">${easy}</div><div class="stat-label">Easy Solved</div></div>
            <div class="card stat-card"><div class="stat-icon" style="background:#fef3c7;color:#92400e">${Layout.icons.code}</div><div class="stat-value">${medium}</div><div class="stat-label">Medium Solved</div></div>
            <div class="card stat-card"><div class="stat-icon" style="background:#fee2e2;color:#991b1b">${Layout.icons.code}</div><div class="stat-value">${hard}</div><div class="stat-label">Hard Solved</div></div>
          </div>

          <h2 style="font-size:1rem;font-weight:600;color:var(--slate-900);margin-bottom:0.75rem">Quick Access</h2>
          <div class="card-grid card-grid-5">
            <a href="/resources.html" class="card" style="text-decoration:none;text-align:center;padding:1.25rem">
              <div style="width:40px;height:40px;border-radius:var(--radius-xl);background:var(--primary-50);color:var(--primary-600);display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem">${Layout.icons.book}</div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--slate-800)">Resources</div>
              <div style="font-size:0.75rem;color:var(--slate-400)">Study materials</div>
            </a>
            <a href="/news.html" class="card" style="text-decoration:none;text-align:center;padding:1.25rem">
              <div style="width:40px;height:40px;border-radius:var(--radius-xl);background:#f3e8ff;color:#7c3aed;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem">${Layout.icons.newspaper}</div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--slate-800)">News</div>
              <div style="font-size:0.75rem;color:var(--slate-400)">Campus updates</div>
            </a>
            <a href="/codinghub.html" class="card" style="text-decoration:none;text-align:center;padding:1.25rem">
              <div style="width:40px;height:40px;border-radius:var(--radius-xl);background:#dbeafe;color:#2563eb;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem">${Layout.icons.code}</div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--slate-800)">Coding Hub</div>
              <div style="font-size:0.75rem;color:var(--slate-400)">Practice problems</div>
            </a>
            <a href="/notifications.html" class="card" style="text-decoration:none;text-align:center;padding:1.25rem">
              <div style="width:40px;height:40px;border-radius:var(--radius-xl);background:#fef3c7;color:#d97706;display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem">${Layout.icons.bell}</div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--slate-800)">Notifications</div>
              <div style="font-size:0.75rem;color:var(--slate-400)">Alerts & messages</div>
            </a>
            <a href="/profile.html" class="card" style="text-decoration:none;text-align:center;padding:1.25rem">
              <div style="width:40px;height:40px;border-radius:var(--radius-xl);background:var(--surface-100);color:var(--slate-600);display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem">${Layout.icons.user}</div>
              <div style="font-size:0.875rem;font-weight:600;color:var(--slate-800)">Profile</div>
              <div style="font-size:0.75rem;color:var(--slate-400)">Your details</div>
            </a>
          </div>`;
      }
    })();
  </script>
</body>
</html>
