<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-brand">
      <div class="auth-brand-blob" style="width:300px;height:300px;top:-80px;left:-80px;background:var(--primary-500)"></div>
      <div style="position:relative;z-index:1">
        <div class="flex items-center gap-3" style="margin-bottom:3rem">
          <div class="sidebar-logo">C</div>
          <span style="color:#fff;font-weight:700;font-size:1.25rem">CampusHub</span>
        </div>
        <h2 style="font-size:2rem;font-weight:700;color:#fff">Reset your password</h2>
        <p style="color:#94a3b8;margin-top:0.5rem">We'll send you a link to reset it.</p>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-container fade-in">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send a reset link.</p>
        <form id="forgot-form" style="margin-top:2rem">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="your.email@university.edu" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-full" id="forgot-btn">Send Reset Link</button>
        </form>
        <p class="text-center" style="margin-top:1.5rem;font-size:0.875rem;color:var(--slate-500)">
          Remember your password? <a href="/login.html" style="font-weight:600">Sign in</a>
        </p>
      </div>
    </div>
  </div>
  <script src="/assets/js/api.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgot-btn');
      const email = document.getElementById('email').value.trim();
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await AuthService.forgotPassword(email);
        Toast.success('If that email exists, a reset link has been sent.');
      } catch(err) { Toast.error(err.message || 'Failed to send reset link.'); }
      btn.disabled = false; btn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
