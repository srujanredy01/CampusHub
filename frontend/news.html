<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (function() {
      if (!CampusHubAPI.isAuthenticated()) { window.location.href = '/login.html'; return; }
      Layout.render('News & Updates', false);
      loadNews();

      async function loadNews() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="page-loader"><div class="spinner spinner-lg"></div></div>';
        try {
          const res = await CampusHubAPI.get('/news/');
          const items = res.results || res.data || [];
          let html = '<h2 style="font-size:1.125rem;font-weight:600;margin-bottom:1.5rem">Campus News</h2>';
          if (items.length === 0) {
            html += '<div class="empty-state"><div class="empty-state-icon">📰</div><div class="empty-state-title">No news articles yet</div></div>';
          } else {
            html += '<div style="display:flex;flex-direction:column;gap:1rem">';
            items.forEach(article => {
              html += `<div class="card"><h3 style="font-size:1rem;font-weight:600;margin-bottom:0.5rem">${App.escapeHtml(article.title)}</h3><p style="font-size:0.875rem;color:var(--slate-500);margin-bottom:0.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${App.escapeHtml(article.summary || article.content || '')}</p><div class="flex items-center gap-3"><span style="font-size:0.75rem;color:var(--slate-400)">${App.formatDate(article.created_at)}</span>${article.is_pinned ? '<span class="badge badge-warning">Pinned</span>' : ''}</div></div>`;
            });
            html += '</div>';
          }
          content.innerHTML = html;
        } catch(err) {
          content.innerHTML = '<div class="empty-state"><div class="empty-state-title">Failed to load news</div></div>';
        }
      }
    })();
  </script>
</body>
</html>
