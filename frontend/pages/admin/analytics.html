<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | CampusHub Admin</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAdmin()) throw new Error('Not admin');
        Components.initLayout('analytics', 'Analytics Dashboard');
        loadAnalytics();

        async function loadAnalytics() {
            const content = document.getElementById('pageContent');
            try {
                const data = await API.get('/admin/analytics');
                const a = data?.data || {};

                content.innerHTML = `
                <div class="animate-fade-in">
                    <div class="grid grid-cols-4 gap-4 mb-6">
                        <div class="stat-card"><div class="stat-icon blue">👥</div><div class="stat-content"><div class="stat-value">${a.daily_active_users || 0}</div><div class="stat-label">Daily Active Users</div></div></div>
                        <div class="stat-card"><div class="stat-icon green">📝</div><div class="stat-content"><div class="stat-value">${a.submissions_today || 0}</div><div class="stat-label">Submissions Today</div></div></div>
                        <div class="stat-card"><div class="stat-icon purple">⬇️</div><div class="stat-content"><div class="stat-value">${a.downloads_today || 0}</div><div class="stat-label">Downloads Today</div></div></div>
                        <div class="stat-card"><div class="stat-icon yellow">🆕</div><div class="stat-content"><div class="stat-value">${a.new_users_week || 0}</div><div class="stat-label">New Users (Week)</div></div></div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="card">
                            <h3 class="card-title mb-4">User Growth</h3>
                            <div id="userGrowthChart" style="height:200px;display:flex;align-items:flex-end;gap:4px;padding-top:var(--space-4)">
                                ${(a.user_growth || []).map(d => {
                                    const max = Math.max(...(a.user_growth || [1]).map(x => x.count || 1));
                                    const height = ((d.count || 0) / max) * 100;
                                    return `<div style="flex:1;background:var(--primary-200);border-radius:4px 4px 0 0;height:${height}%;min-height:4px" title="${d.date}: ${d.count}"></div>`;
                                }).join('') || '<p class="text-sm text-gray-500">No data</p>'}
                            </div>
                        </div>
                        <div class="card">
                            <h3 class="card-title mb-4">Platform Usage</h3>
                            <div class="flex flex-col gap-4">
                                ${[
                                    { label: 'Resources', value: a.resource_views || 0, color: 'blue' },
                                    { label: 'Coding', value: a.coding_submissions || 0, color: 'green' },
                                    { label: 'Assignments', value: a.assignment_submissions || 0, color: 'purple' },
                                    { label: 'News Views', value: a.news_views || 0, color: 'yellow' },
                                ].map(item => `
                                    <div>
                                        <div class="flex justify-between text-sm mb-1">
                                            <span>${item.label}</span>
                                            <span class="font-semibold">${item.value}</span>
                                        </div>
                                        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (item.value / Math.max(a.resource_views || 1, a.coding_submissions || 1, a.assignment_submissions || 1, a.news_views || 1)) * 100)}%;background:var(--${item.color === 'blue' ? 'primary' : item.color === 'green' ? 'success' : item.color === 'purple' ? 'purple' : 'warning'}-500)"></div></div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
            } catch (e) {
                content.innerHTML = `<p class="text-danger">${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
