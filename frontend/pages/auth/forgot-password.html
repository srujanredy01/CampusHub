<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card animate-fade-in">
            <div class="auth-header">
                <div class="auth-logo">🔑</div>
                <h1 class="auth-title">Forgot Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
            </div>

            <form id="forgotForm" onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" id="forgotBtn">
                    Send Reset Link
                </button>

                <div id="forgotError" class="form-error text-center mt-4" style="display:none"></div>
                <div id="forgotSuccess" class="text-center mt-4 text-success text-sm" style="display:none"></div>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="/pages/auth/login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script>
        async function handleForgot(e) {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const errorEl = document.getElementById('forgotError');
            const successEl = document.getElementById('forgotSuccess');
            const email = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.textContent = 'Sending...';
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            try {
                const data = await Auth.forgotPassword(email);
                successEl.textContent = data.message || 'If that email exists, a reset link has been sent.';
                successEl.style.display = 'block';
            } catch (error) {
                errorEl.textContent = error.message || 'Something went wrong.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
