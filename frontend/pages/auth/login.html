<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card animate-fade-in">
            <div class="auth-header">
                <div class="auth-logo">🎓</div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your CampusHub account</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="studentId">Student ID or Email</label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" id="studentId" class="form-input" 
                               placeholder="Enter your Student ID or Email" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-input" 
                               placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <label class="flex items-center gap-2 cursor-pointer text-sm">
                        <input type="checkbox" id="rememberMe">
                        <span class="text-gray-600">Remember me</span>
                    </label>
                    <a href="/pages/auth/forgot-password.html" class="text-sm text-primary">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn">
                    Sign In
                </button>

                <div id="loginError" class="form-error text-center mt-4" style="display:none"></div>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/pages/auth/signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script>
        // Redirect if already logged in
        Auth.redirectIfAuth();

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            const studentId = document.getElementById('studentId').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorEl.style.display = 'none';

            try {
                const data = await Auth.login(studentId, password);
                if (data.success) {
                    Toast.success('Login successful!');
                    const user = data.data.user;
                    if (user.role === 'admin' || user.role === 'super_admin') {
                        window.location.href = '/pages/admin/dashboard.html';
                    } else if (user.role === 'faculty') {
                        window.location.href = '/pages/faculty/dashboard.html';
                    } else {
                        window.location.href = '/pages/student/dashboard.html';
                    }
                }
            } catch (error) {
                errorEl.textContent = error.message || 'Invalid credentials. Please try again.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
