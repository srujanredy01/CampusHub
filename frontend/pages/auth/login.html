<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card" style="max-width:420px">
            <div class="auth-header">
                <div class="auth-logo">C</div>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Sign in to your CampusHub account</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email or Student ID</label>
                    <div class="input-group">
                        <span class="input-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="email" class="form-input" placeholder="you@college.edu" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <div class="flex justify-between items-center mb-1-5">
                        <label class="form-label" for="password" style="margin-bottom:0">Password</label>
                        <a href="/pages/auth/forgot-password.html" style="font-size:var(--text-xs);color:var(--primary-600);font-weight:var(--font-medium)">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="input-action btn-icon btn-icon-sm" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="form-error" style="display:none;margin-bottom:var(--space-3)"></div>

                <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn" style="margin-top:var(--space-2)">
                    Sign in
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/pages/auth/signup.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script>
        // Redirect if already logged in
        if (Auth.isAuthenticated()) {
            const user = Auth.getUser();
            if (user?.role === 'admin' || user?.role === 'super_admin') {
                window.location.href = '/pages/admin/dashboard.html';
            } else {
                window.location.href = '/pages/student/dashboard.html';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.style.display = 'flex';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner spinner-sm" style="border-top-color:#fff"></span> Signing in...';

            try {
                const data = await API.post('/auth/login/', { email, password });
                if (data?.data?.access) {
                    Auth.setTokens(data.data.access, data.data.refresh);
                    Auth.setUser(data.data.user);
                    const role = data.data.user?.role;
                    if (role === 'admin' || role === 'super_admin') {
                        window.location.href = '/pages/admin/dashboard.html';
                    } else {
                        window.location.href = '/pages/student/dashboard.html';
                    }
                } else {
                    throw new Error('Invalid response');
                }
            } catch (err) {
                const msg = err?.response?.data?.detail || err?.response?.data?.error || 'Invalid credentials. Please try again.';
                errorEl.textContent = msg;
                errorEl.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = 'Sign in';
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
