<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card animate-fade-in">
            <div class="auth-header">
                <div class="auth-logo">🔐</div>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your new password below</p>
            </div>

            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Min 8 characters" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="passwordConfirm">Confirm New Password</label>
                    <input type="password" id="passwordConfirm" class="form-input" placeholder="Repeat password" required>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" id="resetBtn">
                    Reset Password
                </button>

                <div id="resetError" class="form-error text-center mt-4" style="display:none"></div>
                <div id="resetSuccess" class="text-center mt-4 text-success text-sm" style="display:none"></div>
            </form>

            <div class="auth-footer">
                <a href="/pages/auth/login.html">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script>
        const params = Utils.getQueryParams();
        const token = params.token;

        if (!token) {
            document.getElementById('resetForm').innerHTML = `
                <div class="empty-state">
                    <p class="text-danger">Invalid or missing reset token.</p>
                    <a href="/pages/auth/forgot-password.html" class="btn btn-primary mt-4">Request New Link</a>
                </div>`;
        }

        async function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const errorEl = document.getElementById('resetError');
            const successEl = document.getElementById('resetSuccess');
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('passwordConfirm').value;

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';
            errorEl.style.display = 'none';

            try {
                const data = await Auth.resetPassword(token, password, confirm);
                successEl.textContent = data.message || 'Password reset successfully. You can now log in.';
                successEl.style.display = 'block';
                document.getElementById('resetForm').querySelector('button').style.display = 'none';
                setTimeout(() => window.location.href = '/pages/auth/login.html', 2000);
            } catch (error) {
                errorEl.textContent = error.message || 'Reset failed. Token may be expired.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
