<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">C</div>
                <h1 class="auth-title">Create account</h1>
                <p class="auth-subtitle">Join CampusHub to access all features</p>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input class="form-input" id="fullName" type="text" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="studentId">Student ID</label>
                    <input class="form-input" id="studentId" type="text" placeholder="e.g. 21BCE1234" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" type="email" placeholder="your.email@university.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" id="password" type="password" placeholder="Create a strong password" required minlength="8">
                    <p class="form-hint">Minimum 8 characters</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input class="form-input" id="confirmPassword" type="password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-full mt-2" id="signupBtn">Create Account</button>

                <div id="signupError" class="mt-3" style="display:none">
                    <div class="alert alert-danger"><span id="signupErrorMsg"></span></div>
                </div>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/pages/auth/login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script>
        if (Auth.redirectIfAuth()) throw new Error('Already authenticated');

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            const errorEl = document.getElementById('signupError');

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                document.getElementById('signupErrorMsg').textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner spinner-sm"></div> Creating account...';
            errorEl.style.display = 'none';

            try {
                const result = await Auth.signup({
                    full_name: document.getElementById('fullName').value.trim(),
                    student_id: document.getElementById('studentId').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: password,
                    password_confirm: confirm,
                });

                if (result.success) {
                    window.location.href = '/pages/auth/login.html?registered=true';
                } else {
                    throw new Error(result.message || 'Registration failed');
                }
            } catch (err) {
                document.getElementById('signupErrorMsg').textContent = err.message || 'Registration failed';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>
</body>
</html>
