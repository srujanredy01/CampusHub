<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('attendance', 'Attendance');
        loadAttendance();

        async function loadAttendance() {
            const content = document.getElementById('pageContent');
            try {
                const [summaryData, subjectsData] = await Promise.allSettled([
                    API.get('/attendance/summary'),
                    API.get('/attendance'),
                ]);

                const summary = summaryData.status === 'fulfilled' ? summaryData.value?.data : {};
                const subjects = subjectsData.status === 'fulfilled' ? (subjectsData.value?.data?.results || subjectsData.value?.data || []) : [];

                const overall = summary?.overall_percentage || 0;
                const color = overall >= 75 ? 'green' : overall >= 60 ? 'yellow' : 'red';

                content.innerHTML = `
                <div class="animate-fade-in">
                    <!-- Summary -->
                    <div class="grid grid-cols-4 gap-4 mb-6">
                        <div class="stat-card">
                            <div class="stat-icon ${color === 'green' ? 'green' : color === 'yellow' ? 'yellow' : 'red'}">📊</div>
                            <div class="stat-content">
                                <div class="stat-value">${overall}%</div>
                                <div class="stat-label">Overall</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon blue">📅</div>
                            <div class="stat-content">
                                <div class="stat-value">${summary?.total_classes || 0}</div>
                                <div class="stat-label">Total Classes</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">✅</div>
                            <div class="stat-content">
                                <div class="stat-value">${summary?.attended || 0}</div>
                                <div class="stat-label">Present</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon red">❌</div>
                            <div class="stat-content">
                                <div class="stat-value">${summary?.missed || 0}</div>
                                <div class="stat-label">Absent</div>
                            </div>
                        </div>
                    </div>

                    <!-- Subject-wise -->
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Subject-wise Attendance</h3>
                            <button class="btn btn-primary btn-sm" onclick="showAddSubject()">+ Add Subject</button>
                        </div>
                        ${subjects.length === 0 ? Components.renderEmptyState('📋', 'No subjects', 'Add your subjects to track attendance') : `
                        <div class="flex flex-col gap-4">
                            ${subjects.map(s => {
                                const pct = s.total_classes > 0 ? Math.round((s.attended / s.total_classes) * 100) : 0;
                                const c = pct >= 75 ? 'green' : pct >= 60 ? 'yellow' : 'red';
                                return `
                                <div class="p-4 rounded-lg border" style="border-color:var(--gray-100)">
                                    <div class="flex items-center justify-between mb-2">
                                        <h4 class="font-medium text-sm">${Utils.escapeHtml(s.subject_name || s.name)}</h4>
                                        <div class="flex items-center gap-3">
                                            <span class="text-sm font-semibold">${pct}%</span>
                                            <button class="btn btn-success btn-sm" onclick="markAttendance('${s.id}', 'present')">✓</button>
                                            <button class="btn btn-danger btn-sm" onclick="markAttendance('${s.id}', 'absent')">✕</button>
                                        </div>
                                    </div>
                                    <div class="progress-bar"><div class="progress-fill ${c}" style="width:${pct}%"></div></div>
                                    <p class="text-xs text-gray-500 mt-1">${s.attended || 0}/${s.total_classes || 0} classes attended</p>
                                </div>`;
                            }).join('')}
                        </div>`}
                    </div>
                </div>

                <!-- Add Subject Modal -->
                <div class="modal-overlay" id="addSubjectModal" onclick="if(event.target===this)Components.closeModal('addSubjectModal')">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 class="modal-title">Add Subject</h3>
                            <button class="modal-close" onclick="Components.closeModal('addSubjectModal')">✕</button>
                        </div>
                        <div class="modal-body">
                            <form onsubmit="addSubject(event)">
                                <div class="form-group">
                                    <label class="form-label">Subject Name</label>
                                    <input type="text" id="subjectName" class="form-input" required placeholder="Data Structures">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="form-group">
                                        <label class="form-label">Total Classes</label>
                                        <input type="number" id="totalClasses" class="form-input" value="0">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Attended</label>
                                        <input type="number" id="attendedClasses" class="form-input" value="0">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-full">Add Subject</button>
                            </form>
                        </div>
                    </div>
                </div>`;
            } catch (e) {
                content.innerHTML = `<p class="text-danger">${e.message}</p>`;
            }
        }

        function showAddSubject() { Components.openModal('addSubjectModal'); }

        async function addSubject(e) {
            e.preventDefault();
            try {
                await API.post('/attendance/create', {
                    subject_name: document.getElementById('subjectName').value,
                    total_classes: parseInt(document.getElementById('totalClasses').value) || 0,
                    attended: parseInt(document.getElementById('attendedClasses').value) || 0,
                });
                Toast.success('Subject added!');
                Components.closeModal('addSubjectModal');
                loadAttendance();
            } catch (e) { Toast.error(e.message); }
        }

        async function markAttendance(id, status) {
            try {
                await API.post(`/attendance/${id}/mark`, { status });
                Toast.success(`Marked ${status}`);
                loadAttendance();
            } catch (e) { Toast.error(e.message); }
        }
    </script>
</body>
</html>
