<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="app-layout" id="app"></div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');

        Components.initLayout('dashboard', 'Dashboard');
        loadDashboard();

        async function loadDashboard() {
            const content = document.getElementById('pageContent');
            const user = Auth.getUser();

            // Show greeting + stats
            content.innerHTML = `
                <div class="animate-fade-in">
                    <!-- Greeting -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-900">Welcome back, ${Utils.escapeHtml(user?.full_name?.split(' ')[0] || 'Student')} 👋</h2>
                        <p class="text-gray-500 mt-1">Here's what's happening with your campus life today.</p>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-4 gap-4 mb-8" id="statsGrid">
                        ${Components.renderSkeleton('card', 4)}
                    </div>

                    <!-- Main Content Grid -->
                    <div class="grid grid-cols-3 gap-6">
                        <!-- Recent Activity -->
                        <div class="card" style="grid-column: span 2">
                            <div class="card-header">
                                <h3 class="card-title">Recent Activity</h3>
                                <a href="/pages/student/notifications.html" class="btn btn-ghost btn-sm">View All</a>
                            </div>
                            <div id="recentActivity">
                                ${Components.renderSkeleton('text', 3)}
                            </div>
                        </div>

                        <!-- Quick Actions -->
                        <div class="card">
                            <h3 class="card-title mb-4">Quick Actions</h3>
                            <div class="flex flex-col gap-3">
                                <a href="/pages/student/coding.html" class="btn btn-secondary w-full">💻 Practice Coding</a>
                                <a href="/pages/student/assignments.html" class="btn btn-secondary w-full">📝 View Assignments</a>
                                <a href="/pages/student/resources.html" class="btn btn-secondary w-full">📚 Browse Resources</a>
                                <a href="/pages/student/placement.html" class="btn btn-secondary w-full">💼 Placement Tracker</a>
                                <a href="/pages/student/resume.html" class="btn btn-secondary w-full">📄 Build Resume</a>
                                <a href="/pages/student/roadmaps.html" class="btn btn-secondary w-full">🗺️ Career Roadmaps</a>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Row -->
                    <div class="grid grid-cols-2 gap-6 mt-6">
                        <!-- Upcoming Assignments -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Upcoming Assignments</h3>
                                <a href="/pages/student/assignments.html" class="btn btn-ghost btn-sm">See All</a>
                            </div>
                            <div id="upcomingAssignments">
                                ${Components.renderSkeleton('text', 2)}
                            </div>
                        </div>

                        <!-- Attendance Overview -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Attendance Overview</h3>
                                <a href="/pages/student/attendance.html" class="btn btn-ghost btn-sm">Details</a>
                            </div>
                            <div id="attendanceOverview">
                                ${Components.renderSkeleton('text', 2)}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Load data
            loadStats();
            loadRecentActivity();
            loadUpcomingAssignments();
            loadAttendanceOverview();
        }

        async function loadStats() {
            const grid = document.getElementById('statsGrid');
            try {
                // Fetch multiple endpoints in parallel
                const [leaderboard, attendance, assignments] = await Promise.allSettled([
                    API.get('/leaderboard/me'),
                    API.get('/attendance/summary'),
                    API.get('/assignments/my'),
                ]);

                const xp = leaderboard.status === 'fulfilled' ? leaderboard.value?.data?.total_xp || 0 : 0;
                const rank = leaderboard.status === 'fulfilled' ? leaderboard.value?.data?.rank || '—' : '—';
                const attendancePercent = attendance.status === 'fulfilled' ? attendance.value?.data?.overall_percentage || 0 : 0;
                const pendingAssignments = assignments.status === 'fulfilled' ? 
                    (assignments.value?.data?.filter(a => a.status === 'pending')?.length || 0) : 0;

                grid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon blue">🏅</div>
                        <div class="stat-content">
                            <div class="stat-value">#${rank}</div>
                            <div class="stat-label">Leaderboard Rank</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">⚡</div>
                        <div class="stat-content">
                            <div class="stat-value">${xp}</div>
                            <div class="stat-label">Total XP</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">📋</div>
                        <div class="stat-content">
                            <div class="stat-value">${attendancePercent}%</div>
                            <div class="stat-label">Attendance</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon yellow">📝</div>
                        <div class="stat-content">
                            <div class="stat-value">${pendingAssignments}</div>
                            <div class="stat-label">Pending Tasks</div>
                        </div>
                    </div>
                `;
            } catch (e) {
                grid.innerHTML = '<p class="text-gray-500 text-sm">Unable to load stats</p>';
            }
        }

        async function loadRecentActivity() {
            const el = document.getElementById('recentActivity');
            try {
                const data = await API.get('/notifications', { page_size: 5 });
                const items = data?.data?.results || data?.data || [];
                if (items.length === 0) {
                    el.innerHTML = Components.renderEmptyState('📭', 'No recent activity', 'Your activity will appear here');
                    return;
                }
                el.innerHTML = items.map(item => `
                    <div class="flex items-center gap-3 py-3 border-b" style="border-color:var(--gray-100)">
                        <div class="avatar avatar-sm">${item.type === 'assignment' ? '📝' : item.type === 'coding' ? '💻' : '🔔'}</div>
                        <div class="flex-1">
                            <p class="text-sm text-gray-700">${Utils.escapeHtml(item.message || item.title || '')}</p>
                            <p class="text-xs text-gray-400">${Utils.timeAgo(item.created_at)}</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                el.innerHTML = '<p class="text-sm text-gray-500">Unable to load activity</p>';
            }
        }

        async function loadUpcomingAssignments() {
            const el = document.getElementById('upcomingAssignments');
            try {
                const data = await API.get('/assignments', { page_size: 5 });
                const items = data?.data?.results || data?.data || [];
                if (items.length === 0) {
                    el.innerHTML = '<p class="text-sm text-gray-500">No upcoming assignments</p>';
                    return;
                }
                el.innerHTML = items.slice(0, 4).map(item => `
                    <div class="flex items-center justify-between py-3 border-b" style="border-color:var(--gray-100)">
                        <div>
                            <p class="text-sm font-medium text-gray-800">${Utils.escapeHtml(item.title)}</p>
                            <p class="text-xs text-gray-500">Due: ${Utils.formatDate(item.due_date)}</p>
                        </div>
                        <span class="badge badge-${Utils.getStatusColor(item.status || 'pending')}">${item.status || 'Pending'}</span>
                    </div>
                `).join('');
            } catch (e) {
                el.innerHTML = '<p class="text-sm text-gray-500">Unable to load assignments</p>';
            }
        }

        async function loadAttendanceOverview() {
            const el = document.getElementById('attendanceOverview');
            try {
                const data = await API.get('/attendance/summary');
                const summary = data?.data;
                if (!summary) {
                    el.innerHTML = '<p class="text-sm text-gray-500">No attendance data</p>';
                    return;
                }
                const percent = summary.overall_percentage || 0;
                const color = percent >= 75 ? 'green' : percent >= 60 ? 'yellow' : 'red';
                el.innerHTML = `
                    <div class="mb-4">
                        <div class="flex justify-between mb-2">
                            <span class="text-sm text-gray-600">Overall Attendance</span>
                            <span class="text-sm font-semibold">${percent}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${color}" style="width:${percent}%"></div>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <div class="text-center">
                            <p class="text-lg font-bold text-gray-900">${summary.total_classes || 0}</p>
                            <p class="text-xs text-gray-500">Total Classes</p>
                        </div>
                        <div class="text-center">
                            <p class="text-lg font-bold text-success">${summary.attended || 0}</p>
                            <p class="text-xs text-gray-500">Attended</p>
                        </div>
                        <div class="text-center">
                            <p class="text-lg font-bold text-danger">${summary.missed || 0}</p>
                            <p class="text-xs text-gray-500">Missed</p>
                        </div>
                    </div>
                `;
            } catch (e) {
                el.innerHTML = '<p class="text-sm text-gray-500">Unable to load attendance</p>';
            }
        }
    </script>
</body>
</html>
