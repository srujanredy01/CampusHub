<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <style>
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: var(--space-4); margin-bottom: var(--space-8); }
        .podium-item { text-align: center; padding: var(--space-4); border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
        .podium-1 { background: linear-gradient(180deg, #ffd700 0%, #ffed4a 100%); height: 160px; }
        .podium-2 { background: linear-gradient(180deg, #c0c0c0 0%, #e5e7eb 100%); height: 130px; }
        .podium-3 { background: linear-gradient(180deg, #cd7f32 0%, #d4a574 100%); height: 110px; }
        .rank-badge { width: 28px; height: 28px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: var(--font-bold); }
        .rank-1 { background: #ffd700; color: #92400e; }
        .rank-2 { background: #c0c0c0; color: #374151; }
        .rank-3 { background: #cd7f32; color: #fff; }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('leaderboard', 'Leaderboard');
        loadLeaderboard();

        async function loadLeaderboard() {
            const content = document.getElementById('pageContent');
            try {
                const [lbData, myData] = await Promise.allSettled([
                    API.get('/leaderboard'),
                    API.get('/leaderboard/me'),
                ]);

                const entries = lbData.status === 'fulfilled' ? (lbData.value?.data?.results || lbData.value?.data || []) : [];
                const me = myData.status === 'fulfilled' ? myData.value?.data : null;

                const top3 = entries.slice(0, 3);

                content.innerHTML = `
                <div class="animate-fade-in">
                    ${me ? `
                    <div class="card mb-6" style="background:linear-gradient(135deg, var(--primary-50), var(--purple-50))">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="avatar avatar-lg">${Utils.getInitials(me.full_name)}</div>
                                <div>
                                    <h3 class="font-semibold">Your Rank: #${me.rank || '—'}</h3>
                                    <p class="text-sm text-gray-500">${me.total_xp || 0} XP • ${me.problems_solved || 0} problems solved</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-2xl font-bold text-primary">${me.total_xp || 0}</p>
                                <p class="text-xs text-gray-500">Total XP</p>
                            </div>
                        </div>
                    </div>` : ''}

                    <!-- Top 3 Podium -->
                    ${top3.length >= 3 ? `
                    <div class="podium">
                        <div class="podium-item podium-2" style="width:120px">
                            <div class="avatar avatar-lg" style="margin:0 auto var(--space-2)">${Utils.getInitials(top3[1].full_name)}</div>
                            <p class="text-sm font-semibold">${Utils.escapeHtml(top3[1].full_name || '')}</p>
                            <p class="text-xs">${top3[1].total_xp || 0} XP</p>
                            <span class="rank-badge rank-2">2</span>
                        </div>
                        <div class="podium-item podium-1" style="width:140px">
                            <div class="avatar avatar-xl" style="margin:0 auto var(--space-2)">${Utils.getInitials(top3[0].full_name)}</div>
                            <p class="font-semibold">${Utils.escapeHtml(top3[0].full_name || '')}</p>
                            <p class="text-sm">${top3[0].total_xp || 0} XP</p>
                            <span class="rank-badge rank-1">👑</span>
                        </div>
                        <div class="podium-item podium-3" style="width:120px">
                            <div class="avatar avatar-lg" style="margin:0 auto var(--space-2)">${Utils.getInitials(top3[2].full_name)}</div>
                            <p class="text-sm font-semibold">${Utils.escapeHtml(top3[2].full_name || '')}</p>
                            <p class="text-xs">${top3[2].total_xp || 0} XP</p>
                            <span class="rank-badge rank-3">3</span>
                        </div>
                    </div>` : ''}

                    <!-- Full Leaderboard -->
                    <div class="card">
                        <div class="table-container">
                            <table class="data-table">
                                <thead><tr><th>Rank</th><th>Name</th><th>XP</th><th>Problems</th><th>Badges</th></tr></thead>
                                <tbody>
                                    ${entries.map((e, i) => `
                                        <tr>
                                            <td><span class="rank-badge ${i < 3 ? 'rank-' + (i+1) : ''}" style="${i >= 3 ? 'background:var(--gray-100)' : ''}">${i + 1}</span></td>
                                            <td class="font-medium">${Utils.escapeHtml(e.full_name || '')}</td>
                                            <td class="font-semibold">${e.total_xp || 0}</td>
                                            <td>${e.problems_solved || 0}</td>
                                            <td>${e.badges_count || 0} 🏅</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            } catch (e) {
                content.innerHTML = `<p class="text-danger">${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
