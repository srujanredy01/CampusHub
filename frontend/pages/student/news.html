<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus News | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <style>
        .news-card {
            background: var(--surface-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        .news-card:hover {
            border-color: var(--gray-300);
            box-shadow: var(--shadow-sm);
        }
        .news-card.featured {
            border-color: var(--primary-200);
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--surface-card) 100%);
        }
        .news-category {
            font-size: var(--text-2xs);
            font-weight: var(--font-semibold);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary-600);
            margin-bottom: var(--space-2);
        }
        .news-title {
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            color: var(--gray-900);
            line-height: var(--leading-snug);
            margin-bottom: var(--space-2);
        }
        .news-excerpt {
            font-size: var(--text-sm);
            color: var(--gray-600);
            line-height: var(--leading-relaxed);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-meta {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-secondary);
            font-size: var(--text-xs);
            color: var(--gray-500);
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('news', 'Campus News');
        loadNews();

        async function loadNews() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
            <div class="animate-fade-in">
                <div class="page-header-row mb-5">
                    <div>
                        <h2 class="page-title">Campus News</h2>
                        <p class="page-subtitle">Announcements and updates</p>
                    </div>
                </div>
                <div class="card mb-5 p-4">
                    <div class="flex items-center gap-3 flex-wrap">
                        <div class="search-bar" style="max-width:280px;flex:1">
                            <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                            <input type="text" placeholder="Search news..." oninput="searchNews(this.value)">
                        </div>
                        <div class="filter-chips">
                            <button class="chip active" onclick="filterCategory('', this)">All</button>
                            <button class="chip" onclick="filterCategory('announcement', this)">Announcements</button>
                            <button class="chip" onclick="filterCategory('event', this)">Events</button>
                            <button class="chip" onclick="filterCategory('academic', this)">Academic</button>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4" id="newsGrid">${Components.renderSkeleton('card', 4)}</div>
                <div id="pagination"></div>
            </div>`;
            fetchNews();
        }

        let newsPage = 1, newsCategory = '', newsSearch = '';

        async function fetchNews() {
            const grid = document.getElementById('newsGrid');
            const params = { page: newsPage, page_size: 10 };
            if (newsCategory) params.category = newsCategory;
            if (newsSearch) params.search = newsSearch;

            try {
                const data = await API.get('/news', params);
                const items = data?.data?.results || data?.data || [];
                const total = data?.data?.count || items.length;

                if (items.length === 0) {
                    grid.innerHTML = `<div class="col-span-full">${Components.renderEmptyState('📰', 'No news found', 'Check back later for updates')}</div>`;
                    return;
                }

                grid.innerHTML = items.map((n, i) => `
                    <div class="news-card ${i === 0 && newsPage === 1 ? 'featured' : ''}" onclick="window.location.href='/pages/student/news-detail.html?id=${n.id}'">
                        <div class="news-category">${Utils.escapeHtml(n.category || 'General')}</div>
                        <h3 class="news-title">${Utils.escapeHtml(n.title)}</h3>
                        <p class="news-excerpt">${Utils.escapeHtml(n.excerpt || n.content?.substring(0, 120) || '')}</p>
                        <div class="news-meta">
                            <span>${Utils.escapeHtml(n.author || 'Admin')}</span>
                            <span>·</span>
                            <span>${Utils.timeAgo(n.created_at)}</span>
                        </div>
                    </div>
                `).join('');

                document.getElementById('pagination').innerHTML = Components.renderPagination(newsPage, Math.ceil(total / 10), 'goToPage');
            } catch (e) {
                grid.innerHTML = `<p class="text-sm text-danger col-span-full">Failed to load news</p>`;
            }
        }

        function goToPage(p) { newsPage = p; fetchNews(); }
        function filterCategory(cat, btn) {
            newsCategory = cat;
            newsPage = 1;
            document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            fetchNews();
        }
        const searchNews = Utils.debounce((val) => { newsSearch = val; newsPage = 1; fetchNews(); }, 400);
    </script>
</body>
</html>
