<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus News | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('news', 'Campus News');
        loadNews();

        async function loadNews() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `<div class="animate-fade-in"><div id="newsList">${Components.renderSkeleton('card', 4)}</div></div>`;

            try {
                const data = await API.get('/news');
                const news = data?.data?.results || data?.data || [];
                const el = document.getElementById('newsList');

                if (news.length === 0) {
                    el.innerHTML = Components.renderEmptyState('📰', 'No news yet', 'Campus news will appear here');
                    return;
                }

                el.innerHTML = news.map(n => `
                    <div class="card mb-4 cursor-pointer" onclick="window.location.href='/pages/student/news-detail.html?id=${n.id}'">
                        <div class="flex items-start gap-4">
                            ${n.image ? `<img src="${n.image}" style="width:120px;height:80px;object-fit:cover;border-radius:var(--radius-md)" alt="">` : ''}
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    ${n.is_pinned ? '<span class="badge badge-warning">📌 Pinned</span>' : ''}
                                    <span class="text-xs text-gray-400">${Utils.timeAgo(n.created_at)}</span>
                                </div>
                                <h3 class="font-semibold text-gray-900">${Utils.escapeHtml(n.title)}</h3>
                                <p class="text-sm text-gray-500 mt-1 line-clamp-2">${Utils.escapeHtml(n.excerpt || n.content?.substring(0, 150) || '')}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('newsList').innerHTML = `<p class="text-danger">${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
