<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Tracker | CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <style>
        .placement-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-5);
            flex-wrap: wrap;
            gap: var(--space-3);
        }
        .placement-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }
        .placement-stat {
            text-align: center;
            padding: var(--space-3);
            background: var(--surface-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-xl);
        }
        .placement-stat-value {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--gray-900);
        }
        .placement-stat-label {
            font-size: var(--text-2xs);
            color: var(--gray-500);
            margin-top: var(--space-0-5);
        }

        .kanban-wrapper {
            overflow-x: auto;
            padding-bottom: var(--space-4);
            margin: 0 calc(-1 * var(--space-4));
            padding-left: var(--space-4);
            padding-right: var(--space-4);
        }

        .kanban-card-company {
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            color: var(--gray-900);
            margin-bottom: var(--space-1);
        }
        .kanban-card-role {
            font-size: var(--text-xs);
            color: var(--gray-500);
        }
        .kanban-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: var(--space-2-5);
            padding-top: var(--space-2);
            border-top: 1px solid var(--border-secondary);
        }

        @media (max-width: 768px) {
            .placement-stats { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('placement', 'Placement Tracker');
        loadPlacement();

        const COLUMNS = ['Wishlist', 'Applied', 'OA Scheduled', 'Interview', 'Offer Received', 'Rejected'];
        const COLUMN_COLORS = {
            'Wishlist': 'var(--gray-500)',
            'Applied': 'var(--info-500)',
            'OA Scheduled': 'var(--warning-500)',
            'Interview': 'var(--purple-500)',
            'Offer Received': 'var(--success-500)',
            'Rejected': 'var(--danger-500)',
        };

        async function loadPlacement() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
            <div class="animate-fade-in">
                <div class="placement-header">
                    <div>
                        <h2 class="page-title">Placement Tracker</h2>
                        <p class="page-subtitle">Track your job applications and interview progress</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Application
                    </button>
                </div>

                <div class="placement-stats" id="placementStats">
                    ${Components.renderSkeleton('stat', 5)}
                </div>

                <div class="kanban-wrapper">
                    <div class="kanban-board" id="kanbanBoard">
                        ${Components.renderSkeleton('card', 3)}
                    </div>
                </div>
            </div>`;

            loadData();
        }

        async function loadData() {
            try {
                const data = await API.get('/placement');
                const items = data?.data?.results || data?.data || [];
                renderStats(items);
                renderKanban(items);
            } catch (e) {
                document.getElementById('kanbanBoard').innerHTML = Components.renderEmptyState(
                    '💼', 'No applications yet', 'Start tracking your placement journey'
                );
            }
        }

        function renderStats(items) {
            const el = document.getElementById('placementStats');
            const total = items.length;
            const applied = items.filter(i => i.status !== 'Wishlist').length;
            const interviews = items.filter(i => i.status?.includes('Interview')).length;
            const offers = items.filter(i => i.status === 'Offer Received' || i.status === 'Selected').length;
            const rejected = items.filter(i => i.status === 'Rejected').length;

            el.innerHTML = `
                <div class="placement-stat">
                    <div class="placement-stat-value">${total}</div>
                    <div class="placement-stat-label">Total</div>
                </div>
                <div class="placement-stat">
                    <div class="placement-stat-value">${applied}</div>
                    <div class="placement-stat-label">Applied</div>
                </div>
                <div class="placement-stat">
                    <div class="placement-stat-value">${interviews}</div>
                    <div class="placement-stat-label">Interviews</div>
                </div>
                <div class="placement-stat">
                    <div class="placement-stat-value" style="color:var(--success-600)">${offers}</div>
                    <div class="placement-stat-label">Offers</div>
                </div>
                <div class="placement-stat">
                    <div class="placement-stat-value" style="color:var(--danger-600)">${rejected}</div>
                    <div class="placement-stat-label">Rejected</div>
                </div>`;
        }

        function renderKanban(items) {
            const board = document.getElementById('kanbanBoard');
            board.innerHTML = COLUMNS.map(col => {
                const colItems = items.filter(i => normalizeStatus(i.status) === col);
                return `
                    <div class="kanban-column">
                        <div class="kanban-column-header">
                            <div class="flex items-center gap-2">
                                <span style="width:8px;height:8px;border-radius:50%;background:${COLUMN_COLORS[col]}"></span>
                                <span class="kanban-column-title">${col}</span>
                            </div>
                            <span class="kanban-column-count">${colItems.length}</span>
                        </div>
                        <div class="kanban-cards">
                            ${colItems.length === 0 ? `<div style="padding:var(--space-6) var(--space-3);text-align:center;color:var(--gray-400);font-size:var(--text-xs)">No items</div>` :
                            colItems.map(item => `
                                <div class="kanban-card">
                                    <div class="kanban-card-company">${Utils.escapeHtml(item.company_name || item.company || '')}</div>
                                    <div class="kanban-card-role">${Utils.escapeHtml(item.role || item.position || '')}</div>
                                    <div class="kanban-card-meta">
                                        <span class="text-2xs text-gray-400">${item.applied_date ? Utils.formatDate(item.applied_date) : '—'}</span>
                                        ${item.package_lpa ? `<span class="badge badge-success">${item.package_lpa} LPA</span>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            }).join('');
        }

        function normalizeStatus(status) {
            if (!status) return 'Wishlist';
            if (status.includes('Interview') || status.includes('HR')) return 'Interview';
            if (status.includes('OA')) return 'OA Scheduled';
            if (status === 'Selected' || status === 'Offer Received') return 'Offer Received';
            if (COLUMNS.includes(status)) return status;
            return 'Applied';
        }

        function openAddModal() {
            // Placeholder for add modal
            Utils.showToast('Add application modal coming soon', 'info');
        }
    </script>
</body>
</html>
