<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <style>
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: var(--space-6);
        }
        .profile-main { display: flex; flex-direction: column; gap: var(--space-5); }
        .profile-aside { display: flex; flex-direction: column; gap: var(--space-5); }

        .profile-completion {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .profile-completion-bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        .profile-completion-fill {
            height: 100%;
            background: #fff;
            border-radius: var(--radius-full);
            transition: width 0.6s var(--ease-spring);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-3);
        }
        .info-item {
            padding: var(--space-3);
            background: var(--surface-secondary);
            border-radius: var(--radius-lg);
        }
        .info-item-label {
            font-size: var(--text-2xs);
            font-weight: var(--font-medium);
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: var(--space-1);
        }
        .info-item-value {
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            color: var(--gray-900);
        }

        .coding-profiles {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }
        .coding-profile-link {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-2-5) var(--space-3);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-primary);
            text-decoration: none;
            color: var(--gray-700);
            transition: all var(--transition-fast);
        }
        .coding-profile-link:hover {
            border-color: var(--primary-200);
            background: var(--primary-50);
            color: var(--primary-700);
            transform: translateX(2px);
        }
        .coding-profile-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-lg);
            background: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-sm);
            flex-shrink: 0;
        }

        @media (max-width: 1024px) {
            .profile-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('profile', 'My Profile');
        loadProfile();

        async function loadProfile() {
            const content = document.getElementById('pageContent');
            const user = Auth.getUser();
            const initials = Utils.getInitials(user?.full_name);
            const completion = calculateCompletion(user);

            content.innerHTML = `
            <div class="animate-fade-in">
                <!-- Profile Hero -->
                <div class="profile-hero">
                    <div class="profile-avatar-large">${initials}</div>
                    <h2 class="profile-name">${Utils.escapeHtml(user?.full_name || 'Student')}</h2>
                    <p class="profile-meta">${Utils.escapeHtml(user?.branch || 'Computer Science')} · ${Utils.escapeHtml(user?.student_id || 'N/A')} · Semester ${user?.semester || '—'}</p>
                    <div class="profile-completion">
                        <span style="font-size:var(--text-xs);opacity:0.9">Profile ${completion}% complete</span>
                        <div class="profile-completion-bar">
                            <div class="profile-completion-fill" style="width:${completion}%"></div>
                        </div>
                    </div>
                </div>

                <div class="profile-grid">
                    <div class="profile-main">
                        <!-- Academic Info -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Academic Information</h3>
                                <a href="/pages/student/settings.html" class="btn btn-ghost btn-xs">Edit</a>
                            </div>
                            <div class="info-grid">
                                <div class="info-item">
                                    <div class="info-item-label">Branch</div>
                                    <div class="info-item-value">${Utils.escapeHtml(user?.branch || '—')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Section</div>
                                    <div class="info-item-value">${Utils.escapeHtml(user?.section || '—')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Semester</div>
                                    <div class="info-item-value">${user?.semester || '—'}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Student ID</div>
                                    <div class="info-item-value">${Utils.escapeHtml(user?.student_id || '—')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Email</div>
                                    <div class="info-item-value">${Utils.escapeHtml(user?.email || '—')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Phone</div>
                                    <div class="info-item-value">${Utils.escapeHtml(user?.phone || '—')}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Coding Profiles -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Coding Profiles</h3>
                            </div>
                            <div class="coding-profiles" id="codingProfiles">
                                ${renderCodingProfiles(user)}
                            </div>
                        </div>

                        <!-- Activity Timeline -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Recent Activity</h3>
                            </div>
                            <div id="activityTimeline">${Components.renderSkeleton('text', 3)}</div>
                        </div>
                    </div>

                    <div class="profile-aside">
                        <!-- Stats -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Performance</h3>
                            </div>
                            <div id="performanceStats">${Components.renderSkeleton('text', 3)}</div>
                        </div>

                        <!-- Badges -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Achievements</h3>
                            </div>
                            <div id="achievements">
                                <div class="empty-state" style="padding:var(--space-8) var(--space-4)">
                                    <div class="empty-state-icon">🏆</div>
                                    <p class="empty-state-title">No badges yet</p>
                                    <p class="empty-state-text">Solve problems and participate in contests to earn badges</p>
                                </div>
                            </div>
                        </div>

                        <!-- Quick Links -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Quick Links</h3>
                            </div>
                            <div class="flex flex-col gap-1">
                                <a href="/pages/student/settings.html" class="coding-profile-link">
                                    <div class="coding-profile-icon">⚙️</div>
                                    <span class="text-sm font-medium">Account Settings</span>
                                </a>
                                <a href="/pages/student/saved.html" class="coding-profile-link">
                                    <div class="coding-profile-icon">🔖</div>
                                    <span class="text-sm font-medium">Saved Content</span>
                                </a>
                                <a href="/pages/student/resume.html" class="coding-profile-link">
                                    <div class="coding-profile-icon">📄</div>
                                    <span class="text-sm font-medium">Resume Builder</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;

            loadPerformance();
            loadActivity();
        }

        function calculateCompletion(user) {
            let score = 0;
            if (user?.full_name) score += 20;
            if (user?.email) score += 20;
            if (user?.branch) score += 15;
            if (user?.phone) score += 15;
            if (user?.student_id) score += 15;
            if (user?.semester) score += 15;
            return Math.min(score, 100);
        }

        function renderCodingProfiles(user) {
            const profiles = [
                { name: 'GitHub', icon: '🐙', key: 'github_url', prefix: 'github.com/' },
                { name: 'LeetCode', icon: '🟡', key: 'leetcode_url', prefix: 'leetcode.com/' },
                { name: 'HackerRank', icon: '🟢', key: 'hackerrank_url', prefix: 'hackerrank.com/' },
                { name: 'CodeChef', icon: '👨‍🍳', key: 'codechef_url', prefix: 'codechef.com/' },
                { name: 'LinkedIn', icon: '🔗', key: 'linkedin_url', prefix: 'linkedin.com/' },
            ];
            return profiles.map(p => {
                const url = user?.[p.key];
                return `
                    <a href="${url || '#'}" class="coding-profile-link" ${url ? 'target="_blank" rel="noopener"' : ''}>
                        <div class="coding-profile-icon">${p.icon}</div>
                        <div style="flex:1;min-width:0">
                            <div class="text-sm font-medium">${p.name}</div>
                            <div class="text-xs text-gray-500 truncate">${url ? Utils.escapeHtml(url) : 'Not linked'}</div>
                        </div>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.4"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    </a>`;
            }).join('');
        }

        async function loadPerformance() {
            const el = document.getElementById('performanceStats');
            try {
                const [stats, attendance] = await Promise.allSettled([
                    API.get('/questions/my-stats'),
                    API.get('/attendance/summary'),
                ]);
                const s = stats.status === 'fulfilled' ? stats.value?.data || {} : {};
                const a = attendance.status === 'fulfilled' ? attendance.value?.data || {} : {};
                el.innerHTML = `
                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-xs text-gray-600">Problems Solved</span>
                            <span class="text-sm font-bold text-gray-900">${s.solved || 0}</span>
                        </div>
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-xs text-gray-600">Accuracy</span>
                            <span class="text-sm font-bold text-gray-900">${s.accuracy || 0}%</span>
                        </div>
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-xs text-gray-600">Day Streak</span>
                            <span class="text-sm font-bold text-gray-900">${s.streak || 0} days</span>
                        </div>
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-xs text-gray-600">Attendance</span>
                            <span class="text-sm font-bold text-gray-900">${a.overall_percentage || 0}%</span>
                        </div>
                        <div class="flex justify-between items-center py-2">
                            <span class="text-xs text-gray-600">Total XP</span>
                            <span class="text-sm font-bold text-primary">${s.total_xp || 0}</span>
                        </div>
                    </div>`;
            } catch (e) {
                el.innerHTML = '<p class="text-sm text-gray-500">Unable to load</p>';
            }
        }

        async function loadActivity() {
            const el = document.getElementById('activityTimeline');
            try {
                const data = await API.get('/notifications', { page_size: 5 });
                const items = data?.data?.results || data?.data || [];
                if (items.length === 0) {
                    el.innerHTML = '<p class="text-sm text-gray-500" style="padding:var(--space-4) 0">No recent activity</p>';
                    return;
                }
                const colors = ['', 'green', 'yellow', 'purple'];
                el.innerHTML = `<div class="timeline">${items.map((item, i) => `
                    <div class="timeline-item">
                        <div class="timeline-dot ${colors[i % colors.length]}"></div>
                        <div>
                            <p class="text-sm text-gray-700">${Utils.escapeHtml(item.message || item.title || '')}</p>
                            <p class="text-xs text-gray-400 mt-1">${Utils.timeAgo(item.created_at)}</p>
                        </div>
                    </div>
                `).join('')}</div>`;
            } catch (e) {
                el.innerHTML = '<p class="text-sm text-gray-500">Unable to load</p>';
            }
        }
    </script>
</body>
</html>
