<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="app-layout" id="app"></div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('resources', 'Academic Resources');

        let currentPage = 1;
        let searchQuery = '';

        loadResources();

        async function loadResources() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
            <div class="animate-fade-in">
                <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
                    <div class="search-bar">
                        <span class="search-icon">🔍</span>
                        <input type="text" placeholder="Search resources..." id="searchInput" 
                               oninput="debouncedSearch(this.value)">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4" id="resourcesGrid">
                    ${Components.renderSkeleton('card', 6)}
                </div>
                <div id="pagination"></div>
            </div>`;

            fetchResources();
        }

        async function fetchResources() {
            const grid = document.getElementById('resourcesGrid');
            const params = { page: currentPage, page_size: 12 };
            if (searchQuery) params.search = searchQuery;

            try {
                const data = await API.get('/resources', params);
                const resources = data?.data?.results || data?.data || [];
                const total = data?.data?.count || resources.length;

                if (resources.length === 0) {
                    grid.innerHTML = Components.renderEmptyState('📚', 'No resources found', 'Try a different search term');
                    return;
                }

                grid.innerHTML = resources.map(r => `
                    <div class="card cursor-pointer" onclick="window.location.href='/pages/student/resource-detail.html?id=${r.id}'">
                        <div class="flex items-start gap-3">
                            <div class="stat-icon blue" style="width:40px;height:40px;font-size:1rem">📄</div>
                            <div class="flex-1">
                                <h4 class="text-sm font-semibold text-gray-900 line-clamp-2">${Utils.escapeHtml(r.title)}</h4>
                                <p class="text-xs text-gray-500 mt-1">${Utils.escapeHtml(r.subject || r.category || '')}</p>
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="badge badge-gray">${Utils.escapeHtml(r.file_type || 'PDF')}</span>
                                    <span class="text-xs text-gray-400">${Utils.formatFileSize(r.file_size)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-3 pt-3 border-t">
                            <span class="text-xs text-gray-400">${Utils.timeAgo(r.created_at)}</span>
                            <span class="text-xs text-gray-500">⬇ ${r.download_count || 0}</span>
                        </div>
                    </div>
                `).join('');

                const totalPages = Math.ceil(total / 12);
                document.getElementById('pagination').innerHTML = Components.renderPagination(currentPage, totalPages, 'goToPage');
            } catch (e) {
                grid.innerHTML = `<p class="text-danger">Failed to load resources: ${e.message}</p>`;
            }
        }

        function goToPage(page) { currentPage = page; fetchResources(); }

        const debouncedSearch = Utils.debounce((value) => {
            searchQuery = value;
            currentPage = 1;
            fetchResources();
        }, 400);
    </script>
</body>
</html>
