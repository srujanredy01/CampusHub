<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Roadmaps | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <style>
        .roadmap-card { position: relative; overflow: hidden; }
        .roadmap-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary-500), var(--purple-500)); }
        .milestone { padding: var(--space-4); border-left: 3px solid var(--gray-200); margin-left: var(--space-4); }
        .milestone.completed { border-left-color: var(--success-500); }
        .milestone-dot { width: 12px; height: 12px; border-radius: var(--radius-full); background: var(--gray-300); position: absolute; left: -7px; top: var(--space-4); }
        .milestone.completed .milestone-dot { background: var(--success-500); }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('roadmaps', 'Career Roadmaps');
        loadRoadmaps();

        async function loadRoadmaps() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
            <div class="animate-fade-in">
                <div class="mb-6">
                    <h2 class="text-xl font-bold">Choose Your Path</h2>
                    <p class="text-sm text-gray-500">Follow structured roadmaps to build your career</p>
                </div>
                <div class="grid grid-cols-3 gap-6" id="roadmapsGrid">
                    ${Components.renderSkeleton('card', 5)}
                </div>
            </div>`;

            try {
                const data = await API.get('/roadmaps');
                const roadmaps = data?.data?.results || data?.data || [];
                const grid = document.getElementById('roadmapsGrid');

                if (roadmaps.length === 0) {
                    grid.innerHTML = Components.renderEmptyState('🗺️', 'No roadmaps available', 'Roadmaps will be added soon');
                    return;
                }

                grid.innerHTML = roadmaps.map(r => {
                    const progress = r.progress || 0;
                    return `
                    <div class="card roadmap-card cursor-pointer" onclick="window.location.href='/pages/student/roadmap-detail.html?slug=${r.slug}'">
                        <div class="mb-3">
                            <span class="text-2xl">${getIcon(r.category || r.title)}</span>
                        </div>
                        <h3 class="font-semibold text-gray-900">${Utils.escapeHtml(r.title)}</h3>
                        <p class="text-xs text-gray-500 mt-1 line-clamp-2">${Utils.escapeHtml(r.description || '')}</p>
                        <div class="mt-4">
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-gray-500">${r.milestones_count || 0} milestones</span>
                                <span class="font-medium">${progress}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width:${progress}%"></div>
                            </div>
                        </div>
                        ${r.is_enrolled ? '<span class="badge badge-success mt-3">Enrolled</span>' : ''}
                    </div>`;
                }).join('');
            } catch (e) {
                document.getElementById('roadmapsGrid').innerHTML = `<p class="text-danger">${e.message}</p>`;
            }
        }

        function getIcon(category) {
            const icons = { 'Web Development': '🌐', 'AI/ML': '🤖', 'DevOps': '⚙️', 'Cybersecurity': '🔒', 'DSA': '📊' };
            for (const [key, icon] of Object.entries(icons)) {
                if (category?.includes(key)) return icon;
            }
            return '🗺️';
        }
    </script>
</body>
</html>
