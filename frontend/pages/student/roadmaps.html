<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Roadmaps | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <style>
        .roadmap-card {
            background: var(--surface-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            transition: all var(--transition-fast);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .roadmap-card:hover {
            border-color: var(--primary-200);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .roadmap-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: var(--space-4);
        }
        .roadmap-icon.web { background: var(--info-50); }
        .roadmap-icon.ai { background: var(--purple-50); }
        .roadmap-icon.devops { background: var(--success-50); }
        .roadmap-icon.security { background: var(--danger-50); }
        .roadmap-icon.dsa { background: var(--warning-50); }
        .roadmap-title {
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            color: var(--gray-900);
            margin-bottom: var(--space-1);
        }
        .roadmap-desc {
            font-size: var(--text-xs);
            color: var(--gray-500);
            line-height: var(--leading-relaxed);
            margin-bottom: var(--space-4);
            flex: 1;
        }
        .roadmap-progress-section {
            margin-top: auto;
        }
        .roadmap-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--space-2);
        }
        .roadmap-stat {
            font-size: var(--text-2xs);
            color: var(--gray-500);
        }
        .roadmap-stat strong {
            color: var(--gray-800);
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('roadmaps', 'Career Roadmaps');
        loadRoadmaps();

        async function loadRoadmaps() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
            <div class="animate-fade-in">
                <div class="page-header mb-6">
                    <h2 class="page-title">Career Roadmaps</h2>
                    <p class="page-subtitle">Structured learning paths to guide your career</p>
                </div>
                <div class="grid grid-cols-3 gap-5" id="roadmapGrid">${Components.renderSkeleton('card', 5)}</div>
            </div>`;
            fetchRoadmaps();
        }

        async function fetchRoadmaps() {
            const grid = document.getElementById('roadmapGrid');
            try {
                const data = await API.get('/roadmaps');
                const items = data?.data?.results || data?.data || [];

                if (items.length === 0) {
                    // Show default roadmaps
                    const defaults = [
                        { id: 'web', title: 'Web Development', desc: 'Full-stack web development with modern frameworks', icon: '🌐', iconClass: 'web', milestones: 12, completed: 0 },
                        { id: 'ai', title: 'AI / Machine Learning', desc: 'From fundamentals to deep learning and deployment', icon: '🤖', iconClass: 'ai', milestones: 15, completed: 0 },
                        { id: 'devops', title: 'DevOps & Cloud', desc: 'CI/CD, containers, cloud infrastructure', icon: '☁️', iconClass: 'devops', milestones: 10, completed: 0 },
                        { id: 'security', title: 'Cybersecurity', desc: 'Network security, ethical hacking, and defense', icon: '🔒', iconClass: 'security', milestones: 11, completed: 0 },
                        { id: 'dsa', title: 'DSA + Placements', desc: 'Data structures, algorithms, and interview prep', icon: '🎯', iconClass: 'dsa', milestones: 20, completed: 0 },
                    ];
                    grid.innerHTML = defaults.map(r => renderRoadmapCard(r)).join('');
                    return;
                }

                grid.innerHTML = items.map(r => renderRoadmapCard(r)).join('');
            } catch (e) {
                // Fallback
                const defaults = [
                    { id: 'web', title: 'Web Development', desc: 'Full-stack web development with modern frameworks', icon: '🌐', iconClass: 'web', milestones: 12, completed: 0 },
                    { id: 'ai', title: 'AI / Machine Learning', desc: 'From fundamentals to deep learning and deployment', icon: '🤖', iconClass: 'ai', milestones: 15, completed: 0 },
                    { id: 'devops', title: 'DevOps & Cloud', desc: 'CI/CD, containers, cloud infrastructure', icon: '☁️', iconClass: 'devops', milestones: 10, completed: 0 },
                    { id: 'security', title: 'Cybersecurity', desc: 'Network security, ethical hacking, and defense', icon: '🔒', iconClass: 'security', milestones: 11, completed: 0 },
                    { id: 'dsa', title: 'DSA + Placements', desc: 'Data structures, algorithms, and interview prep', icon: '🎯', iconClass: 'dsa', milestones: 20, completed: 0 },
                ];
                grid.innerHTML = defaults.map(r => renderRoadmapCard(r)).join('');
            }
        }

        function renderRoadmapCard(r) {
            const total = r.milestones || r.total_milestones || 10;
            const completed = r.completed || r.completed_milestones || 0;
            const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
            return `
            <div class="roadmap-card" onclick="window.location.href='/pages/student/roadmap-detail.html?id=${r.id}'">
                <div class="roadmap-icon ${r.iconClass || ''}">${r.icon || '📍'}</div>
                <div class="roadmap-title">${Utils.escapeHtml(r.title || r.name || '')}</div>
                <div class="roadmap-desc">${Utils.escapeHtml(r.desc || r.description || '')}</div>
                <div class="roadmap-progress-section">
                    <div class="roadmap-stats">
                        <span class="roadmap-stat"><strong>${completed}</strong> / ${total} milestones</span>
                        <span class="roadmap-stat"><strong>${pct}%</strong></span>
                    </div>
                    <div class="progress-bar progress-bar-sm">
                        <div class="progress-fill" style="width:${pct}%"></div>
                    </div>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
