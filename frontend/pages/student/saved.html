<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Content | CampusHub</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <style>
        .saved-tabs {
            display: flex;
            gap: var(--space-1);
            background: var(--gray-100);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-6);
        }
        .saved-tab {
            flex: 1;
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--gray-600);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: center;
            border: none;
            background: transparent;
        }
        .saved-tab:hover { color: var(--gray-900); }
        .saved-tab.active {
            background: white;
            color: var(--primary-700);
            box-shadow: var(--shadow-sm);
        }
        .saved-tab .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: var(--radius-full);
            background: var(--gray-200);
            font-size: 11px;
            font-weight: var(--font-semibold);
            margin-left: var(--space-1);
        }
        .saved-tab.active .tab-count {
            background: var(--primary-100);
            color: var(--primary-700);
        }
        .saved-content-panel { display: none; }
        .saved-content-panel.active { display: block; }
        .saved-toolbar {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
        }
        .saved-search {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .saved-search input {
            width: 100%;
            padding: var(--space-2) var(--space-3) var(--space-2) var(--space-9);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            background: var(--surface-primary);
            transition: border-color var(--transition-fast);
        }
        .saved-search input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px var(--primary-100);
        }
        .saved-search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }
        .filter-select {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            background: var(--surface-primary);
            color: var(--gray-700);
            cursor: pointer;
        }
        .saved-card {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-4);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-3);
            transition: all var(--transition-fast);
            background: var(--surface-primary);
        }
        .saved-card:hover {
            border-color: var(--primary-200);
            box-shadow: var(--shadow-sm);
        }
        .saved-card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }
        .saved-card-icon.coding { background: var(--primary-50); color: var(--primary-600); }
        .saved-card-icon.news { background: #fef3c7; color: #d97706; }
        .saved-card-icon.resource { background: #dbeafe; color: #2563eb; }
        .saved-card-body { flex: 1; min-width: 0; }
        .saved-card-title {
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--gray-900);
            margin-bottom: var(--space-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .saved-card-meta {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
        }
        .saved-card-meta span {
            font-size: var(--text-xs);
            color: var(--gray-500);
        }
        .saved-card-actions {
            display: flex;
            gap: var(--space-2);
            flex-shrink: 0;
        }
        .saved-card-actions .btn {
            padding: var(--space-1-5) var(--space-2-5);
            font-size: var(--text-xs);
        }
        .badge-difficulty {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: var(--font-semibold);
        }
        .badge-difficulty.easy { background: #dcfce7; color: #166534; }
        .badge-difficulty.medium { background: #fef9c3; color: #854d0e; }
        .badge-difficulty.hard { background: #fee2e2; color: #991b1b; }
        .empty-state {
            text-align: center;
            padding: var(--space-12) var(--space-6);
        }
        .empty-state-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-4);
            background: var(--gray-100);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-state h3 {
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            color: var(--gray-800);
            margin-bottom: var(--space-2);
        }
        .empty-state p {
            font-size: var(--text-sm);
            color: var(--gray-500);
            max-width: 360px;
            margin: 0 auto;
        }
        .skeleton-card {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-4);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-3);
        }
        .skeleton-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: var(--gray-200);
            animation: pulse 1.5s infinite;
        }
        .skeleton-text {
            height: 12px;
            border-radius: var(--radius-sm);
            background: var(--gray-200);
            animation: pulse 1.5s infinite;
        }
        .skeleton-text.w-60 { width: 60%; }
        .skeleton-text.w-40 { width: 40%; }
        .skeleton-text.w-20 { width: 20%; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-1);
            margin-top: var(--space-6);
        }
        .pagination button {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            background: var(--surface-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .pagination button:hover:not(:disabled) { border-color: var(--primary-500); color: var(--primary-600); }
        .pagination button.active { background: var(--primary-600); color: white; border-color: var(--primary-600); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 768px) {
            .saved-tabs { flex-wrap: wrap; }
            .saved-tab { flex: none; min-width: 80px; }
            .saved-toolbar { flex-direction: column; align-items: stretch; }
            .saved-card { flex-direction: column; align-items: flex-start; }
            .saved-card-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/components.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        Components.initLayout('saved', 'Saved Content');

        // State
        let currentTab = 'all';
        let savedData = { coding: [], news: [], resources: [] };
        let counts = { coding: 0, news: 0, resources: 0 };
        let loading = true;
        let currentPage = 1;
        const PAGE_SIZE = 10;

        init();

        async function init() {
            renderPage();
            await loadAllSaved();
        }

        function renderPage() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
            <div class="animate-fade-in">
                <div class="page-header mb-6">
                    <h2 class="page-title">Saved Content</h2>
                    <p class="page-subtitle">Your bookmarked problems, articles, and resources</p>
                </div>

                <div class="saved-tabs" role="tablist">
                    <button class="saved-tab active" onclick="switchTab('all', this)" role="tab" aria-selected="true">
                        All <span class="tab-count" id="countAll">0</span>
                    </button>
                    <button class="saved-tab" onclick="switchTab('coding', this)" role="tab" aria-selected="false">
                        Coding <span class="tab-count" id="countCoding">0</span>
                    </button>
                    <button class="saved-tab" onclick="switchTab('news', this)" role="tab" aria-selected="false">
                        News <span class="tab-count" id="countNews">0</span>
                    </button>
                    <button class="saved-tab" onclick="switchTab('resources', this)" role="tab" aria-selected="false">
                        Resources <span class="tab-count" id="countResources">0</span>
                    </button>
                </div>

                <div id="savedPanelContent">
                    ${renderSkeletons()}
                </div>
            </div>`;
        }

        function renderSkeletons() {
            return Array(5).fill('').map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div style="flex:1;display:flex;flex-direction:column;gap:var(--space-2);">
                        <div class="skeleton-text w-60"></div>
                        <div class="skeleton-text w-40"></div>
                    </div>
                    <div class="skeleton-text w-20" style="width:60px;height:28px;border-radius:var(--radius-md);"></div>
                </div>
            `).join('');
        }

        async function loadAllSaved() {
            loading = true;
            try {
                const [codingRes, newsRes, resourcesRes] = await Promise.all([
                    API.get('/saved/coding'),
                    API.get('/saved/news'),
                    API.get('/saved/resources'),
                ]);
                savedData.coding = codingRes?.data?.results || codingRes?.data || [];
                savedData.news = newsRes?.data?.results || newsRes?.data || [];
                savedData.resources = resourcesRes?.data?.results || resourcesRes?.data || [];

                counts.coding = savedData.coding.length;
                counts.news = savedData.news.length;
                counts.resources = savedData.resources.length;

                updateCounts();
            } catch (e) {
                Toast.error('Failed to load saved content');
                console.error(e);
            }
            loading = false;
            renderPanel();
        }

        function updateCounts() {
            const total = counts.coding + counts.news + counts.resources;
            document.getElementById('countAll').textContent = total;
            document.getElementById('countCoding').textContent = counts.coding;
            document.getElementById('countNews').textContent = counts.news;
            document.getElementById('countResources').textContent = counts.resources;
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            currentPage = 1;
            document.querySelectorAll('.saved-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');
            renderPanel();
        }

        function renderPanel() {
            const panel = document.getElementById('savedPanelContent');
            if (loading) { panel.innerHTML = renderSkeletons(); return; }

            let items = [];
            if (currentTab === 'all') {
                items = [
                    ...savedData.coding.map(i => ({...i, _type: 'coding'})),
                    ...savedData.news.map(i => ({...i, _type: 'news'})),
                    ...savedData.resources.map(i => ({...i, _type: 'resources'})),
                ].sort((a, b) => new Date(b.saved_at) - new Date(a.saved_at));
            } else if (currentTab === 'coding') {
                items = savedData.coding.map(i => ({...i, _type: 'coding'}));
            } else if (currentTab === 'news') {
                items = savedData.news.map(i => ({...i, _type: 'news'}));
            } else {
                items = savedData.resources.map(i => ({...i, _type: 'resources'}));
            }

            // Render toolbar
            let toolbarHtml = `
                <div class="saved-toolbar">
                    <div class="saved-search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" placeholder="Search saved content..." id="savedSearchInput" oninput="handleSearch(this.value)">
                    </div>
                    ${currentTab === 'coding' ? `
                        <select class="filter-select" id="filterDifficulty" onchange="renderPanel()">
                            <option value="">All Difficulties</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                        <select class="filter-select" id="filterTopic" onchange="renderPanel()">
                            <option value="">All Topics</option>
                            <option value="arrays">Arrays</option>
                            <option value="strings">Strings</option>
                            <option value="linked_list">Linked List</option>
                            <option value="trees">Trees</option>
                            <option value="graphs">Graphs</option>
                            <option value="dp">Dynamic Programming</option>
                            <option value="sorting">Sorting</option>
                            <option value="searching">Searching</option>
                            <option value="recursion">Recursion</option>
                            <option value="greedy">Greedy</option>
                            <option value="hashing">Hashing</option>
                        </select>
                    ` : ''}
                    ${currentTab === 'resources' ? `
                        <select class="filter-select" id="filterFileType" onchange="renderPanel()">
                            <option value="">All Types</option>
                            <option value="pdf">PDF</option>
                            <option value="presentation">Presentation</option>
                            <option value="document">Document</option>
                            <option value="spreadsheet">Spreadsheet</option>
                        </select>
                    ` : ''}
                </div>
            `;

            // Apply filters
            const searchVal = document.getElementById('savedSearchInput')?.value?.toLowerCase() || '';
            if (searchVal) {
                items = items.filter(item => {
                    const detail = item.content_detail;
                    if (!detail) return false;
                    return detail.title?.toLowerCase().includes(searchVal) ||
                           detail.subject?.toLowerCase().includes(searchVal) ||
                           detail.short_description?.toLowerCase().includes(searchVal);
                });
            }

            if (currentTab === 'coding') {
                const diffFilter = document.getElementById('filterDifficulty')?.value || '';
                const topicFilter = document.getElementById('filterTopic')?.value || '';
                if (diffFilter) items = items.filter(i => i.content_detail?.difficulty === diffFilter);
                if (topicFilter) items = items.filter(i => i.content_detail?.topic === topicFilter);
            }
            if (currentTab === 'resources') {
                const typeFilter = document.getElementById('filterFileType')?.value || '';
                if (typeFilter) items = items.filter(i => i.content_detail?.file_type === typeFilter);
            }

            // Pagination
            const totalPages = Math.ceil(items.length / PAGE_SIZE);
            const paginatedItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

            // Render items
            let cardsHtml = '';
            if (paginatedItems.length === 0) {
                cardsHtml = renderEmptyState();
            } else {
                cardsHtml = paginatedItems.map(item => renderCard(item)).join('');
            }

            // Pagination controls
            let paginationHtml = '';
            if (totalPages > 1) {
                paginationHtml = `<div class="pagination">
                    <button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">← Prev</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
                        paginationHtml += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                    } else if (Math.abs(i - currentPage) === 2) {
                        paginationHtml += `<button disabled>...</button>`;
                    }
                }
                paginationHtml += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next →</button></div>`;
            }

            panel.innerHTML = toolbarHtml + cardsHtml + paginationHtml;
        }

        function renderCard(item) {
            const detail = item.content_detail;
            if (!detail) {
                return `<div class="saved-card" style="opacity:0.5;">
                    <div class="saved-card-icon ${item._type}">?</div>
                    <div class="saved-card-body">
                        <div class="saved-card-title">Content no longer available</div>
                        <div class="saved-card-meta"><span>Saved ${Utils.timeAgo(item.saved_at)}</span></div>
                    </div>
                    <div class="saved-card-actions">
                        <button class="btn btn-sm btn-ghost" onclick="unsaveItem('${item.id}')">Remove</button>
                    </div>
                </div>`;
            }

            if (item._type === 'coding' || item.content_type === 'coding_problem') {
                return `<div class="saved-card">
                    <div class="saved-card-icon coding">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    </div>
                    <div class="saved-card-body">
                        <div class="saved-card-title">${Utils.escapeHtml(detail.title)}</div>
                        <div class="saved-card-meta">
                            <span class="badge-difficulty ${detail.difficulty}">${detail.difficulty}</span>
                            <span>${detail.topic?.replace('_', ' ')}</span>
                            ${detail.topic_tags?.length ? `<span>• ${detail.topic_tags.slice(0,2).join(', ')}</span>` : ''}
                            <span>• Saved ${Utils.timeAgo(item.saved_at)}</span>
                        </div>
                    </div>
                    <div class="saved-card-actions">
                        <button class="btn btn-sm btn-primary" onclick="window.location.href='/pages/student/coding.html?id=${detail.id}'">Open</button>
                        <button class="btn btn-sm btn-ghost" onclick="unsaveItem('${item.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>`;
            }

            if (item._type === 'news' || item.content_type === 'news_article') {
                return `<div class="saved-card">
                    <div class="saved-card-icon news">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/></svg>
                    </div>
                    <div class="saved-card-body">
                        <div class="saved-card-title">${Utils.escapeHtml(detail.title)}</div>
                        <div class="saved-card-meta">
                            <span style="text-transform:capitalize;">${detail.category?.replace('_', ' ')}</span>
                            <span>• ${Utils.formatDate(detail.created_at)}</span>
                            ${detail.short_description ? `<span>• ${Utils.truncate(detail.short_description, 60)}</span>` : ''}
                            <span>• Saved ${Utils.timeAgo(item.saved_at)}</span>
                        </div>
                    </div>
                    <div class="saved-card-actions">
                        <button class="btn btn-sm btn-primary" onclick="window.location.href='/pages/student/news.html?id=${detail.id}'">Read</button>
                        <button class="btn btn-sm btn-ghost" onclick="unsaveItem('${item.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>`;
            }

            if (item._type === 'resources' || item.content_type === 'resource') {
                const fileIcons = { pdf: '📄', presentation: '📊', document: '📝', spreadsheet: '📈', other: '📁' };
                return `<div class="saved-card">
                    <div class="saved-card-icon resource">
                        <span>${fileIcons[detail.file_type] || '📁'}</span>
                    </div>
                    <div class="saved-card-body">
                        <div class="saved-card-title">${Utils.escapeHtml(detail.title)}</div>
                        <div class="saved-card-meta">
                            <span style="text-transform:capitalize;">${detail.file_type}</span>
                            <span>• ${detail.subject}</span>
                            <span>• Year ${detail.academic_year}, Sem ${detail.semester}</span>
                            ${detail.file_size ? `<span>• ${Utils.formatFileSize(detail.file_size)}</span>` : ''}
                            <span>• Saved ${Utils.timeAgo(item.saved_at)}</span>
                        </div>
                    </div>
                    <div class="saved-card-actions">
                        <button class="btn btn-sm btn-outline" onclick="previewResource('${detail.id}')">Preview</button>
                        <button class="btn btn-sm btn-primary" onclick="downloadResource('${detail.id}')">Download</button>
                        <button class="btn btn-sm btn-ghost" onclick="unsaveItem('${item.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>`;
            }

            return '';
        }

        function renderEmptyState() {
            const messages = {
                all: { title: 'No saved content yet', desc: 'Save coding problems, news articles, and resources to access them quickly later.' },
                coding: { title: 'No saved coding problems', desc: 'Bookmark coding problems from the Coding Hub to practice later.' },
                news: { title: 'No saved articles', desc: 'Save news articles to read them later at your convenience.' },
                resources: { title: 'No saved resources', desc: 'Save academic resources for quick access to study materials.' },
            };
            const msg = messages[currentTab] || messages.all;
            return `
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    </div>
                    <h3>${msg.title}</h3>
                    <p>${msg.desc}</p>
                </div>
            `;
        }

        async function unsaveItem(id) {
            if (!confirm('Remove this item from saved?')) return;
            try {
                await API.delete(`/saved/${id}`);
                Toast.success('Item removed from saved');
                await loadAllSaved();
            } catch (e) {
                Toast.error('Failed to remove item');
            }
        }

        function previewResource(id) {
            window.open(`${Config.API_BASE_URL}/resources/${id}/preview`, '_blank');
        }

        function downloadResource(id) {
            window.open(`${Config.API_BASE_URL}/resources/${id}/download`, '_blank');
        }

        const handleSearch = Utils.debounce(function(value) {
            currentPage = 1;
            renderPanel();
        }, 300);

        function goToPage(page) {
            currentPage = page;
            renderPanel();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
