<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app" class="app-layout"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    (function() {
      if (!CampusHubAPI.isAuthenticated()) { window.location.href = '/login.html'; return; }
      Layout.render('My Profile', false);
      loadProfile();

      async function loadProfile() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="page-loader"><div class="spinner spinner-lg"></div></div>';
        let profile = {};
        try { const res = await CampusHubAPI.get('/profile/'); profile = res.data || res; } catch(e) {}
        const user = CampusHubAPI.getUser();
        const initials = (user?.full_name || 'U').split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();

        content.innerHTML = `
          <div class="card" style="margin-bottom:1.5rem">
            <div class="flex items-center gap-4" style="margin-bottom:1.5rem">
              <div style="width:64px;height:64px;border-radius:var(--radius-2xl);background:linear-gradient(135deg,var(--primary-500),var(--accent-violet));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-weight:700">${initials}</div>
              <div>
                <h2 style="font-size:1.25rem;font-weight:700;color:var(--slate-900)">${App.escapeHtml(user?.full_name || '')}</h2>
                <p style="font-size:0.875rem;color:var(--slate-500)">${App.escapeHtml(user?.email || '')}</p>
                <p style="font-size:0.75rem;color:var(--slate-400)">Student ID: ${App.escapeHtml(user?.student_id || '')}</p>
              </div>
            </div>
            <div class="card-grid card-grid-3">
              <div style="padding:1rem;background:var(--surface-50);border-radius:var(--radius-xl)"><div style="font-size:0.75rem;color:var(--slate-500)">Branch</div><div style="font-weight:600">${App.escapeHtml(user?.branch || 'N/A')}</div></div>
              <div style="padding:1rem;background:var(--surface-50);border-radius:var(--radius-xl)"><div style="font-size:0.75rem;color:var(--slate-500)">Semester</div><div style="font-weight:600">${user?.semester || 'N/A'}</div></div>
              <div style="padding:1rem;background:var(--surface-50);border-radius:var(--radius-xl)"><div style="font-size:0.75rem;color:var(--slate-500)">Section</div><div style="font-weight:600">${App.escapeHtml(user?.section || 'N/A')}</div></div>
            </div>
          </div>
          <div class="card">
            <h3 style="font-size:1rem;font-weight:600;margin-bottom:1rem">Change Password</h3>
            <form id="change-pwd-form">
              <div class="form-group"><label class="form-label">Current Password</label><input type="password" id="old_password" class="form-input" required></div>
              <div class="form-group"><label class="form-label">New Password</label><input type="password" id="new_password" class="form-input" required minlength="8"></div>
              <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" id="new_password_confirm" class="form-input" required></div>
              <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
          </div>`;

        document.getElementById('change-pwd-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const old_password = document.getElementById('old_password').value;
          const new_password = document.getElementById('new_password').value;
          const confirm = document.getElementById('new_password_confirm').value;
          if (new_password !== confirm) { Toast.error('Passwords do not match.'); return; }
          try {
            await AuthService.changePassword(old_password, new_password, confirm);
            Toast.success('Password changed. Please log in again.');
            CampusHubAPI.clearTokens();
            setTimeout(() => { window.location.href = '/login.html'; }, 1500);
          } catch(err) { Toast.error(err.message || 'Failed to change password.'); }
        });
      }
    })();
  </script>
</body>
</html>
