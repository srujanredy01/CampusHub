<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-brand">
      <div class="auth-brand-blob" style="width:300px;height:300px;top:-80px;left:-80px;background:var(--primary-500)"></div>
      <div style="position:relative;z-index:1">
        <div class="flex items-center gap-3" style="margin-bottom:3rem">
          <div class="sidebar-logo">C</div>
          <span style="color:#fff;font-weight:700;font-size:1.25rem">CampusHub</span>
        </div>
        <h2 style="font-size:2rem;font-weight:700;color:#fff">Set a new password</h2>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-container fade-in">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your new password below.</p>
        <form id="reset-form" style="margin-top:2rem">
          <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label" for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" class="form-input" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-full" id="reset-btn">Reset Password</button>
        </form>
        <p class="text-center" style="margin-top:1.5rem;font-size:0.875rem;color:var(--slate-500)">
          <a href="/login.html" style="font-weight:600">Back to login</a>
        </p>
      </div>
    </div>
  </div>
  <script src="/assets/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) { Toast.error('Invalid reset link.'); }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password_confirm').value;
      if (password !== confirm) { Toast.error('Passwords do not match.'); return; }
      btn.disabled = true; btn.textContent = 'Resetting...';
      try {
        await AuthService.resetPassword(token, password, confirm);
        Toast.success('Password reset! You can now log in.');
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      } catch(err) {
        Toast.error(err.message || 'Reset failed.');
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
