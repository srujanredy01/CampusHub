<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-brand">
      <div class="auth-brand-blob" style="width:300px;height:300px;top:-80px;left:-80px;background:var(--primary-500)"></div>
      <div class="auth-brand-blob" style="width:250px;height:250px;bottom:-60px;right:-60px;background:var(--accent-violet)"></div>
      <div style="position:relative;z-index:1">
        <div class="flex items-center gap-3" style="margin-bottom:3rem">
          <div class="sidebar-logo">C</div>
          <span style="color:#fff;font-weight:700;font-size:1.25rem">CampusHub</span>
        </div>
        <h2 style="font-size:2.25rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:1rem">Join your campus community.</h2>
        <p style="color:#94a3b8;max-width:360px;line-height:1.7">Create your account to access all academic resources and tools.</p>
      </div>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-container fade-in">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Fill in your details to get started.</p>
        <form id="signup-form" style="margin-top:1.5rem" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="full_name">Full Name</label>
            <input type="text" id="full_name" class="form-input" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="your.email@university.edu" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="student_id">Student ID</label>
            <input type="text" id="student_id" class="form-input" placeholder="Your university student ID" inputmode="numeric" required>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group">
              <label class="form-label" for="branch">Branch</label>
              <select id="branch" class="form-input"><option value="">Select</option><option>CSE</option><option>ECE</option><option>EEE</option><option>ME</option><option>CE</option><option>IT</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="semester">Semester</label>
              <select id="semester" class="form-input"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="s_password">Password</label>
            <input type="password" id="s_password" class="form-input" placeholder="Min 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label" for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" class="form-input" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-full" id="signup-btn">Create Account</button>
        </form>
        <p class="text-center" style="margin-top:1.5rem;font-size:0.875rem;color:var(--slate-500)">
          Already have an account? <a href="/login.html" style="font-weight:600">Sign in</a>
        </p>
      </div>
    </div>
  </div>
  <script src="/assets/js/api.js"></script>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      const data = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        student_id: document.getElementById('student_id').value.trim(),
        branch: document.getElementById('branch').value,
        semester: parseInt(document.getElementById('semester').value),
        password: document.getElementById('s_password').value,
        password_confirm: document.getElementById('password_confirm').value,
      };
      if (data.password !== data.password_confirm) { Toast.error('Passwords do not match.'); return; }
      if (data.password.length < 8) { Toast.error('Password must be at least 8 characters.'); return; }

      btn.disabled = true; btn.textContent = 'Creating account...';
      try {
        await AuthService.signup(data);
        Toast.success('Account created! Please check your email to verify.');
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      } catch (err) {
        Toast.error(err.message || 'Signup failed.');
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
    if (CampusHubAPI.isAuthenticated()) window.location.href = '/dashboard.html';
  </script>
</body>
</html>
