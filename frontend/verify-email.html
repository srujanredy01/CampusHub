<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — CampusHub</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem">
    <div class="card" style="max-width:420px;width:100%;text-align:center">
      <div class="sidebar-logo" style="width:48px;height:48px;font-size:1.25rem;margin:0 auto 1.5rem">C</div>
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem" id="title">Verifying Email...</h1>
      <p style="color:var(--slate-500)" id="message">Please wait while we verify your email address.</p>
      <div id="spinner" class="page-loader" style="margin:1.5rem 0"><div class="spinner"></div></div>
      <a href="/login.html" class="btn btn-primary hidden" id="login-btn" style="margin-top:1.5rem">Go to Login</a>
    </div>
  </div>
  <script src="/assets/js/api.js"></script>
  <script>
    (async function() {
      const token = new URLSearchParams(window.location.search).get('token');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const spinner = document.getElementById('spinner');
      const loginBtn = document.getElementById('login-btn');

      if (!token) {
        title.textContent = 'Invalid Link';
        message.textContent = 'No verification token found.';
        spinner.classList.add('hidden');
        loginBtn.classList.remove('hidden');
        return;
      }
      try {
        await CampusHubAPI.get(`/auth/verify-email?token=${token}`);
        title.textContent = 'Email Verified!';
        message.textContent = 'Your email has been verified. You can now log in.';
        title.style.color = 'var(--success)';
      } catch(err) {
        title.textContent = 'Verification Failed';
        message.textContent = err.message || 'Invalid or expired token.';
        title.style.color = 'var(--danger)';
      }
      spinner.classList.add('hidden');
      loginBtn.classList.remove('hidden');
    })();
  </script>
</body>
</html>
