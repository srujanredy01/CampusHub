global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "campushub"

# Load alert rules
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration (optional — configure when ready)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # Django application metrics (via django-prometheus)
  - job_name: "django"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics/"
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter - host system metrics
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
    scrape_interval: 15s

  # cAdvisor - container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 15s

  # PostgreSQL Exporter (optional - add postgres_exporter service)
  # - job_name: "postgresql"
  #   static_configs:
  #     - targets: ["postgres_exporter:9187"]

  # Executor service health
  - job_name: "executor"
    static_configs:
      - targets: ["executor:8001"]
    metrics_path: "/health"
    scrape_interval: 30s
